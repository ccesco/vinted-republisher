# Configuration commune à tous les environnements : aucune valeur propre au poste de dev.
# Les variables sans valeur par défaut sont obligatoires : l'application refuse de démarrer sans elles.
spring:
  application:
    name: vinted-republisher
  jackson:
    # Contrat d'API : un champ absent signifie « aucun », jamais null
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Outil local, sans authentification, qui pilote un Chrome connecté au compte Vinted.
server:
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Dossier des images sauvegardées (hors git, à sauvegarder avec la base)
app:
  data-dir: ${APP_DATA_DIR}

# Site Vinted (US-03) : la page des paramètres du profil s'affiche pour un membre connecté
# et redirige un visiteur vers la connexion (le dressing, public, ne permet pas de le savoir).
vinted:
  profile-settings-url: https://www.vinted.fr/settings/profile
  # Formulaire de mise en vente (US-12) : la republication le remplit comme le membre.
  listing-form-url: https://www.vinted.fr/items/new
  # Dressing du membre (US-04), de la forme https://www.vinted.fr/member/<id>.
  wardrobe-url: ${VINTED_WARDROBE_URL}
  # Rythme du scan : pauses aléatoires entre deux défilements et entre deux annonces,
  # arrêt du relevé après stall-timeout sans nouveau lien.
  scan:
    min-scroll-pause: 3s
    max-scroll-pause: 6s
    min-listing-pause: 10s
    max-listing-pause: 15s
    stall-timeout: 30s
  # Sauvegarde (US-05, US-06) : formulaire de modification puis page publique de chaque annonce, lus sans rien
  # cliquer ni soumettre, avec une pause aléatoire entre deux pages ; un libellé encore non affiché après
  # label-timeout est vide ; une photo non téléchargée après photo-timeout rend l'annonce illisible.
  backup:
    edit-form-url: https://www.vinted.fr/items/{id}/edit
    listing-page-url: https://www.vinted.fr/items/{id}
    min-page-pause: 5s
    max-page-pause: 10s
    label-timeout: 10s
    photo-timeout: 30s

# Suppression sur Vinted (US-09, US-10) : dry-run par défaut, y compris sans la variable ; seule la valeur exacte
# false active les suppressions réelles, toute autre valeur empêche l'application de démarrer.
deletion:
  dry-run: ${DELETION_DRY_RUN:true}

# Republication (US-11) : délai minimal entre la preuve d'une suppression et la republication de l'annonce.
# Même valeur partout ; absent, nul, négatif ou illisible, l'application ne démarre pas.
# Republication (US-12) : dry-run par défaut, indépendant de celui de la suppression ; seule la valeur exacte false
# active les republications réelles, toute autre valeur empêche l'application de démarrer.
republication:
  minimum-delay: 5m
  dry-run: ${REPUBLICATION_DRY_RUN:true}

# Limites de cadence (US-27) : une écriture sur Vinted (suppression ou republication réelle) attend l'intervalle de son
# type (deletion-interval, republication-interval) depuis la dernière écriture, quel que soit le type de celle-ci, et
# au plus daily-* de chaque type sur 24 heures glissantes. Absent, nul, négatif ou illisible, l'application ne démarre pas.
cadence:
  deletion-interval: 30s
  republication-interval: 2m
  daily-deletions: 140
  daily-republications: 20

# Traitement en parallèle (US-15) : nombre d'actions sur des annonces (suppression, republication et leurs
# vérifications) menées en même temps, chacune dans son onglet du même Chrome, par la série comme à la main.
# 1 par défaut : plusieurs onglets augmentent le risque de blocage anti-robot, et la cadence ci-dessus reste commune
# à tout le compte. De 1 à 4 ; absent ou illisible, l'application ne démarre pas.
parallelism:
  listing-actions: 1

# Chrome normal démarré par l'outil, piloté par son port de débogage (127.0.0.1 uniquement).
chrome:
  path: ${CHROME_PATH}
  debug-port: ${CHROME_DEBUG_PORT}

# Swagger UI affiche le contrat écrit à la main (contract first), pas le contrat déduit du code.
# springdoc n'active Swagger UI que si /v3/api-docs est actif : il reste exposé mais inutilisé.
springdoc:
  swagger-ui:
    url: /openapi/vinted-republisher.yaml
