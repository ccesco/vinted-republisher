# Configuration commune à tous les environnements : aucune valeur propre au poste de dev.
# Les variables sans valeur par défaut sont obligatoires : l'application refuse de démarrer sans elles.
spring:
  application:
    name: vinted-republisher
  jackson:
    # Contrat d'API : un champ absent signifie « aucun », jamais null
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Outil local, sans authentification, qui pilote un Chrome connecté au compte Vinted.
server:
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Dossier des images sauvegardées (hors git, à sauvegarder avec la base)
app:
  data-dir: ${APP_DATA_DIR}

# Site Vinted (US-03) : la page des paramètres du profil s'affiche pour un membre connecté
# et redirige un visiteur vers la connexion (le dressing, public, ne permet pas de le savoir).
vinted:
  profile-settings-url: https://www.vinted.fr/settings/profile
  # Dressing du membre (US-04), de la forme https://www.vinted.fr/member/<id>.
  wardrobe-url: ${VINTED_WARDROBE_URL}
  # Rythme du scan : pauses aléatoires entre deux défilements et entre deux annonces,
  # arrêt du relevé après stall-timeout sans nouveau lien.
  scan:
    min-scroll-pause: 3s
    max-scroll-pause: 6s
    min-listing-pause: 10s
    max-listing-pause: 15s
    stall-timeout: 30s
  # Sauvegarde (US-05) : formulaire de modification de chaque annonce, lu sans rien cliquer ni soumettre,
  # avec une pause aléatoire entre deux annonces ; un libellé encore non affiché après label-timeout est vide.
  backup:
    edit-form-url: https://www.vinted.fr/items/{id}/edit
    min-listing-pause: 10s
    max-listing-pause: 15s
    label-timeout: 10s

# Chrome normal démarré par l'outil, piloté par son port de débogage (127.0.0.1 uniquement).
chrome:
  path: ${CHROME_PATH}
  debug-port: ${CHROME_DEBUG_PORT}

# Swagger UI affiche le contrat écrit à la main (contract first), pas le contrat déduit du code.
# springdoc n'active Swagger UI que si /v3/api-docs est actif : il reste exposé mais inutilisé.
springdoc:
  swagger-ui:
    url: /openapi/vinted-republisher.yaml
