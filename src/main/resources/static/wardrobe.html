<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dressing</title>
</head>
<body>
<h1>Dressing</h1>
<p id="wardrobe-summary"></p>
<p id="scan-progress" hidden>Scan en cours…</p>
<p id="wardrobe-problem" role="alert" hidden></p>
<p><button id="scan" type="button" hidden>Scanner</button></p>
<p id="backup-summary"></p>
<p id="backup-progress" hidden>Sauvegarde en cours…</p>
<p id="backup-problem" role="alert" hidden></p>
<p><button id="backup" type="button" hidden>Sauvegarder</button></p>
<ul id="listings"></ul>
<script>
    // Codes du contrat OpenAPI (ScanProblem) -> libellés affichés.
    const PROBLEM_MESSAGES = {
        BROWSER_UNAVAILABLE: 'Le navigateur est indisponible (Chrome introuvable ou qui ne répond pas) : voir les logs.',
        VINTED_UNREACHABLE: 'Vinted est inaccessible (réseau ou blocage anti-robot) : réessayez plus tard.',
        WARDROBE_UNREADABLE: 'Le dressing est illisible (total incohérent ou page changée) : ce qui a été lu est conservé, le prochain scan reprendra. Voir les logs.',
        SCAN_FAILED: 'Le scan a échoué : ce qui a été lu est conservé, le prochain scan reprendra. Voir les logs.'
    };
    // Codes du contrat OpenAPI (BackupProblem) -> libellés affichés.
    const BACKUP_PROBLEM_MESSAGES = {
        BROWSER_UNAVAILABLE: 'Le navigateur est indisponible (Chrome introuvable ou qui ne répond pas) : voir les logs.',
        VINTED_UNREACHABLE: 'Vinted est inaccessible (réseau, blocage anti-robot ou annonce disparue) : ce qui a été sauvegardé est conservé, la prochaine sauvegarde reprendra.',
        SESSION_DISCONNECTED: "La session Vinted n'est pas connectée : connectez-vous depuis la page de la session, puis relancez la sauvegarde, qui reprendra là où elle s'est arrêtée.",
        LISTING_UNREADABLE: 'Une annonce est illisible (formulaire changé ou incomplet) : sa sauvegarde précédente est intacte. Voir les logs.',
        BACKUP_FAILED: 'La sauvegarde a échoué : ce qui a été sauvegardé est conservé, la prochaine sauvegarde reprendra. Voir les logs.'
    };
    const APPLICATION_DOWN_MESSAGE = "L'application ne répond pas : nouvel essai dans 2 secondes.";
    const POLL_INTERVAL_MS = 2000;

    const summary = document.getElementById('wardrobe-summary');
    const progress = document.getElementById('scan-progress');
    const problemMessage = document.getElementById('wardrobe-problem');
    const scanButton = document.getElementById('scan');
    const listings = document.getElementById('listings');
    const backupSummary = document.getElementById('backup-summary');
    const backupProgress = document.getElementById('backup-progress');
    const backupProblem = document.getElementById('backup-problem');
    const backupButton = document.getElementById('backup');

    // Application arrêtée ou en erreur : on réessaie jusqu'à ce qu'elle réponde.
    async function refresh() {
        try {
            const response = await fetch('/api/wardrobe');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            follow(await response.json());
        } catch (unreachable) {
            problemMessage.textContent = APPLICATION_DOWN_MESSAGE;
            problemMessage.hidden = false;
            setTimeout(refresh, POLL_INTERVAL_MS);
        }
    }

    function summaryOf(overview) {
        if (!overview.lastScanAt) {
            return "Aucun scan terminé pour l'instant.";
        }
        const count = overview.listings.length;
        const date = new Date(overview.lastScanAt).toLocaleString('fr-FR');
        return `${count} annonce${count > 1 ? 's' : ''}, dernier scan le ${date}.`;
    }

    function backupSummaryOf(overview) {
        if (!overview.lastBackupAt) {
            return "Aucune sauvegarde terminée pour l'instant.";
        }
        return `Dernière sauvegarde terminée le ${new Date(overview.lastBackupAt).toLocaleString('fr-FR')}.`;
    }

    function backupStateOf(listing) {
        if (!listing.savedAt) {
            return 'non sauvegardée';
        }
        const saved = 'sauvegardée le ' + new Date(listing.savedAt).toLocaleString('fr-FR');
        const photos = listing.photoCount
            ? ` · ${listing.photoCount} ${listing.photoCount > 1 ? 'photos' : 'photo'}` : '';
        const validated = listing.validatedAt
            ? ' · validée le ' + new Date(listing.validatedAt).toLocaleString('fr-FR') : '';
        return saved + photos + validated;
    }

    function statisticsOf(listing) {
        if (!listing.statistics) {
            return '';
        }
        const {viewCount, favouriteCount} = listing.statistics;
        return `${viewCount} ${viewCount > 1 ? 'vues' : 'vue'} · ${favouriteCount} ${favouriteCount > 1 ? 'favoris' : 'favori'} – `;
    }

    // Titres et liens viennent de Vinted : jamais d'innerHTML.
    function rowOf(listing) {
        const link = document.createElement('a');
        link.href = listing.url;
        link.rel = 'noopener noreferrer';
        link.textContent = listing.title;
        const price = new Intl.NumberFormat('fr-FR', {style: 'currency', currency: listing.price.currency})
            .format(listing.price.amount);
        const row = document.createElement('li');
        row.append(link, ' – ' + price + ' – ' + statisticsOf(listing) + backupStateOf(listing));
        if (listing.savedAt) {
            const preview = document.createElement('a');
            preview.href = 'listing-backup.html?id=' + encodeURIComponent(listing.vintedId);
            preview.textContent = 'Voir la sauvegarde';
            row.append(' – ', preview);
        }
        return row;
    }

    function show(overview) {
        summary.textContent = summaryOf(overview);
        progress.hidden = !overview.scanInProgress;
        // Une seule action navigateur à la fois : aucune autre n'est proposée pendant un scan ou une sauvegarde.
        const busy = overview.scanInProgress || overview.backupInProgress;
        scanButton.hidden = busy;
        backupButton.hidden = busy;
        backupSummary.textContent = backupSummaryOf(overview);
        backupProgress.hidden = !overview.backupInProgress;
        backupProblem.textContent = BACKUP_PROBLEM_MESSAGES[overview.backupProblem] ?? '';
        backupProblem.hidden = !overview.backupProblem;
        problemMessage.textContent = PROBLEM_MESSAGES[overview.problem] ?? '';
        problemMessage.hidden = !overview.problem;
        listings.replaceChildren(...overview.listings.map(rowOf));
    }

    function follow(overview) {
        show(overview);
        if (overview.scanInProgress || overview.backupInProgress) {
            setTimeout(refresh, POLL_INTERVAL_MS);
        }
    }

    // La réponse donne l'action lancée ; en cas d'échec, refresh affiche le problème.
    async function launch(path) {
        scanButton.hidden = true;
        backupButton.hidden = true;
        try {
            const response = await fetch(path, {method: 'POST'});
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            follow(await response.json());
        } catch (failed) {
            await refresh();
        }
    }

    scanButton.addEventListener('click', () => launch('/api/wardrobe/scan'));
    backupButton.addEventListener('click', () => launch('/api/wardrobe/backup'));
    refresh();
</script>
</body>
</html>
