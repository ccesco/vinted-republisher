<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dressing</title>
</head>
<body>
<h1>Dressing</h1>
<p><a href="journal.html">Journal</a> · <a href="sales.html">Ventes</a> · <a href="live-preview.html">Aperçu live</a></p>
<p id="wardrobe-summary"></p>
<p id="scan-progress" hidden>Scan en cours…</p>
<p id="wardrobe-problem" role="alert" hidden></p>
<p><button id="scan" type="button" hidden>Scanner</button></p>
<p id="backup-summary"></p>
<p id="backup-progress" hidden>Sauvegarde en cours…</p>
<p id="backup-problem" role="alert" hidden></p>
<p><button id="backup" type="button" hidden>Sauvegarder</button></p>
<p id="statistics-summary"></p>
<p id="statistics-progress" hidden>Rafraîchissement des vues et favoris en cours…</p>
<p id="statistics-problem" role="alert" hidden></p>
<p><button id="statistics-refresh" type="button" hidden>Rafraîchir les vues et favoris</button></p>
<p id="archive-problem" role="alert" hidden></p>
<p><button id="data-archive" type="button">Télécharger une archive</button></p>
<p id="run-summary"></p>
<p>
    <button id="automatic-run" type="button" hidden>Tout lancer</button>
    <button id="pause-run" type="button" hidden>Pause</button>
    <button id="resume-run" type="button" hidden>Reprendre</button>
    <button id="stop-run" type="button" hidden>Arrêter</button>
</p>
<h2>Annonces</h2>
<p>
    <label>Présence
        <select id="presence">
            <option value="PRESENT" selected>Présentes</option>
            <option value="ABSENT">Absentes</option>
            <option value="ALL">Toutes</option>
        </select>
    </label>
    <label>Sauvegarde
        <select id="backup-filter">
            <option value="ALL" selected>Toutes</option>
            <option value="NOT_BACKED_UP">Non sauvegardées</option>
            <option value="NOT_VALIDATED">Sauvegardées non validées</option>
            <option value="VALIDATED">Validées</option>
        </select>
    </label>
    <label>Recherche <input id="search" type="search" maxlength="100"></label>
    <label>Tri
        <select id="sort">
            <option value="RECENCY" selected>Mise en ligne</option>
            <option value="TITLE">Titre</option>
            <option value="PRICE">Prix</option>
            <option value="VIEWS">Vues</option>
            <option value="FAVOURITES">Favoris</option>
            <option value="SAVED_AT">Date de sauvegarde</option>
        </select>
    </label>
    <label>Sens
        <select id="direction">
            <option value="DESC" selected>Décroissant</option>
            <option value="ASC">Croissant</option>
        </select>
    </label>
    <label>Tag
        <select id="tag-filter">
            <option value="" selected>Tous</option>
        </select>
    </label>
</p>
<p>
    <span id="selection-count">0 annonce sélectionnée</span>
    <label>Tag <input id="tag-name" type="text" maxlength="100"></label>
    <button id="add-tag" type="button" disabled>Ajouter le tag</button>
    <button id="remove-tag" type="button" disabled>Retirer le tag</button>
    <span id="tag-edit-message" role="status"></span>
</p>
<p id="listing-count"></p>
<p id="listings-problem" role="alert" hidden>Liste indisponible.</p>
<table id="listings">
    <thead>
    <tr>
        <th scope="col">Titre</th>
        <th scope="col">Prix</th>
        <th scope="col">Vues</th>
        <th scope="col">Favoris</th>
        <th scope="col">Conseil</th>
        <th scope="col">Présence</th>
        <th scope="col">Sauvegarde</th>
        <th scope="col">Validation</th>
        <th scope="col">Étape</th>
        <th scope="col">Action</th>
        <th scope="col">Tags</th>
        <th scope="col"><input id="select-all" type="checkbox" aria-label="Sélectionner toutes les annonces affichées"></th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<script>
    // Codes du contrat OpenAPI (ListingStage) -> libellés affichés.
    const STAGE_LABELS = {
        TO_BACK_UP: 'À sauvegarder', TO_VALIDATE: 'À valider', TO_DELETE: 'Prête à supprimer',
        DELETION_TO_CHECK: 'Suppression à vérifier', WAITING: 'En attente avant republication',
        TO_REPUBLISH: 'À republier', REPUBLICATION_TO_CHECK: 'Republication à vérifier', REPUBLISHED: 'Republiée',
        GONE: 'Absente de Vinted'
    };
    // Étapes qui demandent de vérifier sur Vinted : mises en évidence.
    const STAGES_TO_CHECK = ['DELETION_TO_CHECK', 'REPUBLICATION_TO_CHECK'];
    // Étapes qui se relancent (US-20) ; le serveur en déduit l'action.
    const RELAUNCHABLE_STAGES = ['TO_DELETE', 'DELETION_TO_CHECK', 'TO_REPUBLISH', 'REPUBLICATION_TO_CHECK'];
    // Codes du contrat OpenAPI (RelaunchAction) -> message une fois l'action faite.
    const RELAUNCH_DONE_MESSAGES = {
        DELETION: 'Suppression faite', DELETION_RECHECK: 'Revérification faite',
        REPUBLICATION: 'Republication faite', REPUBLICATION_VERIFICATION: 'Vérification faite'
    };
    const RELAUNCH_DRY_RUN_MESSAGE = "Dry-run réussi, rien n'a été modifié sur Vinted";
    const RELAUNCH_UNCERTAIN_MESSAGE = 'Issue incertaine : à vérifier sur Vinted';
    const RELAUNCH_FAILED_MESSAGE = 'Échec de la relance : vérifiez la fiche avant de relancer';
    // Codes du contrat OpenAPI (RelaunchRefusal) -> message ; ACTION_REFUSED ajoute le lien de la fiche.
    const RELAUNCH_REFUSAL_MESSAGES = {
        STAGE_CHANGED: "L'étape a changé depuis l'affichage : relisez la ligne avant de relancer",
        NOT_RELAUNCHABLE: 'Rien à relancer à cette étape',
        CADENCE_LIMIT_REACHED: 'limite de cadence atteinte',
        BROWSER_BUSY: 'Navigateur occupé : relancez une fois l\'action en cours finie',
        ACTION_REFUSED: 'Relance refusée : voir la fiche',
        BROWSER_UNAVAILABLE: 'Navigateur indisponible : voir les logs',
        VINTED_UNREACHABLE: 'Vinted est inaccessible : réessayez plus tard',
        SESSION_DISCONNECTED: "La session Vinted n'est pas connectée : connectez-vous depuis la page de la session",
        VINTED_PAGE_UNREADABLE: 'Page de Vinted illisible : voir les logs'
    };
    // Codes du contrat OpenAPI (ScanProblem) -> libellés affichés.
    const PROBLEM_MESSAGES = {
        BROWSER_UNAVAILABLE: 'Le navigateur est indisponible (Chrome introuvable ou qui ne répond pas) : voir les logs.',
        VINTED_UNREACHABLE: 'Vinted est inaccessible (réseau ou blocage anti-robot) : réessayez plus tard.',
        WARDROBE_UNREADABLE: 'Le dressing est illisible (total incohérent ou page changée) : ce qui a été lu est conservé, le prochain scan reprendra. Voir les logs.',
        SCAN_FAILED: 'Le scan a échoué : ce qui a été lu est conservé, le prochain scan reprendra. Voir les logs.'
    };
    // Codes du contrat OpenAPI (BackupProblem) -> libellés affichés.
    const BACKUP_PROBLEM_MESSAGES = {
        BROWSER_UNAVAILABLE: 'Le navigateur est indisponible (Chrome introuvable ou qui ne répond pas) : voir les logs.',
        VINTED_UNREACHABLE: 'Vinted est inaccessible (réseau, blocage anti-robot ou annonce disparue) : ce qui a été sauvegardé est conservé, la prochaine sauvegarde reprendra.',
        SESSION_DISCONNECTED: "La session Vinted n'est pas connectée : connectez-vous depuis la page de la session, puis relancez la sauvegarde, qui reprendra là où elle s'est arrêtée.",
        LISTING_UNREADABLE: 'Une annonce est illisible (formulaire changé ou incomplet) : sa sauvegarde précédente est intacte. Voir les logs.',
        BACKUP_FAILED: 'La sauvegarde a échoué : ce qui a été sauvegardé est conservé, la prochaine sauvegarde reprendra. Voir les logs.'
    };
    // Codes du contrat OpenAPI (StatisticsRefreshProblem) -> libellés affichés (US-25).
    const STATISTICS_PROBLEM_MESSAGES = {
        BROWSER_UNAVAILABLE: 'Le navigateur est indisponible (Chrome introuvable ou qui ne répond pas) : voir les logs.',
        VINTED_UNREACHABLE: 'Vinted est inaccessible (réseau ou blocage anti-robot) : réessayez plus tard.',
        WARDROBE_UNREADABLE: "Le dressing est illisible (total incohérent ou page changée) : aucun relevé n'a été ajouté. Voir les logs.",
        NO_STATISTICS_SHOWN: "Aucune carte du dressing ne montre ses vues et favoris : vérifiez que la session Vinted est connectée. Aucun relevé n'a été ajouté.",
        REFRESH_FAILED: "Le rafraîchissement a échoué : aucun relevé n'a été ajouté. Voir les logs."
    };
    // Codes du contrat OpenAPI (RunStopReason) -> raison affichée de l'arrêt de la série (US-19).
    const RUN_STOP_MESSAGES = {
        SESSION_DISCONNECTED: "la session Vinted n'est pas connectée (connectez-vous, puis relancez)",
        BROWSER_UNAVAILABLE: 'le navigateur est indisponible (voir les logs)',
        VINTED_UNREACHABLE: 'Vinted est inaccessible (réseau ou blocage anti-robot) : réessayez plus tard',
        VINTED_PAGE_UNREADABLE: 'une page de Vinted est illisible (page changée ?) : voir les logs',
        RUN_FAILED: 'échec inattendu (voir les logs)'
    };
    // Codes du contrat OpenAPI (DataArchiveRefusalReason) -> libellés affichés (US-26).
    const ARCHIVE_PROBLEM_MESSAGES = {
        BROWSER_BUSY: 'Une action navigateur est en cours : réessayez quand elle sera finie.',
        ARCHIVE_FAILED: "L'archive n'a pas pu être créée : rien n'a été téléchargé. Voir les logs."
    };
    const APPLICATION_DOWN_MESSAGE = "L'application ne répond pas : nouvel essai dans 2 secondes.";
    const POLL_INTERVAL_MS = 2000;
    const SEARCH_DELAY_MS = 300;

    const summary = document.getElementById('wardrobe-summary');
    const progress = document.getElementById('scan-progress');
    const problemMessage = document.getElementById('wardrobe-problem');
    const scanButton = document.getElementById('scan');
    const backupSummary = document.getElementById('backup-summary');
    const backupProgress = document.getElementById('backup-progress');
    const backupProblem = document.getElementById('backup-problem');
    const backupButton = document.getElementById('backup');
    const statisticsSummary = document.getElementById('statistics-summary');
    const statisticsProgress = document.getElementById('statistics-progress');
    const statisticsProblem = document.getElementById('statistics-problem');
    const statisticsButton = document.getElementById('statistics-refresh');
    const archiveProblem = document.getElementById('archive-problem');
    const archiveButton = document.getElementById('data-archive');
    const runSummary = document.getElementById('run-summary');
    const runButton = document.getElementById('automatic-run');
    const pauseButton = document.getElementById('pause-run');
    const resumeButton = document.getElementById('resume-run');
    const stopButton = document.getElementById('stop-run');
    const rows = document.querySelector('#listings tbody');
    const listingCount = document.getElementById('listing-count');
    const listingsProblem = document.getElementById('listings-problem');
    // Ordre des paramètres de GET /api/listings, chacun lu dans la commande du même nom.
    const CRITERIA = {
        presence: document.getElementById('presence'),
        backup: document.getElementById('backup-filter'),
        search: document.getElementById('search'),
        sort: document.getElementById('sort'),
        direction: document.getElementById('direction'),
        tag: document.getElementById('tag-filter')
    };

    // Application arrêtée ou en erreur : on réessaie jusqu'à ce qu'elle réponde.
    async function refresh() {
        try {
            const response = await fetch('/api/wardrobe');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            follow(await response.json());
        } catch (unreachable) {
            problemMessage.textContent = APPLICATION_DOWN_MESSAGE;
            problemMessage.hidden = false;
            setTimeout(refresh, POLL_INTERVAL_MS);
        }
    }

    function dateOf(instant) {
        return new Date(instant).toLocaleString('fr-FR');
    }

    function summaryOf(overview) {
        if (!overview.lastScanAt) {
            return "Aucun scan terminé pour l'instant.";
        }
        return `Dernier scan terminé le ${dateOf(overview.lastScanAt)}.`;
    }

    function backupSummaryOf(overview) {
        if (!overview.lastBackupAt) {
            return "Aucune sauvegarde terminée pour l'instant.";
        }
        return `Dernière sauvegarde terminée le ${dateOf(overview.lastBackupAt)}.`;
    }

    function statisticsSummaryOf(overview) {
        if (!overview.lastStatisticsReadAt) {
            return "Vues et favoris jamais relevés pour l'instant.";
        }
        return `Vues et favoris relevés le ${dateOf(overview.lastStatisticsReadAt)}.`;
    }

    function inProgress(overview) {
        return overview.scanInProgress || overview.backupInProgress || overview.statisticsRefreshInProgress;
    }

    function show(overview) {
        summary.textContent = summaryOf(overview);
        progress.hidden = !overview.scanInProgress;
        // Une seule action navigateur à la fois : aucune autre n'est proposée pendant un scan, une sauvegarde ou un
        // rafraîchissement des vues et favoris.
        const busy = inProgress(overview);
        scanButton.hidden = busy;
        backupButton.hidden = busy;
        statisticsButton.hidden = busy;
        wardrobeBusy = busy;
        showRunButton();
        backupSummary.textContent = backupSummaryOf(overview);
        backupProgress.hidden = !overview.backupInProgress;
        backupProblem.textContent = BACKUP_PROBLEM_MESSAGES[overview.backupProblem] ?? '';
        backupProblem.hidden = !overview.backupProblem;
        problemMessage.textContent = PROBLEM_MESSAGES[overview.problem] ?? '';
        problemMessage.hidden = !overview.problem;
        statisticsSummary.textContent = statisticsSummaryOf(overview);
        statisticsProgress.hidden = !overview.statisticsRefreshInProgress;
        statisticsProblem.textContent = STATISTICS_PROBLEM_MESSAGES[overview.statisticsRefreshProblem] ?? '';
        statisticsProblem.hidden = !overview.statisticsRefreshProblem;
    }

    // La liste est relue à chaque aperçu : pendant un scan elle se remplit, à sa fin elle est à jour.
    function follow(overview) {
        show(overview);
        loadListings();
        if (inProgress(overview)) {
            setTimeout(refresh, POLL_INTERVAL_MS);
        }
    }

    function criteriaQuery() {
        const query = new URLSearchParams();
        for (const [name, control] of Object.entries(CRITERIA)) {
            const value = control.value.trim();
            if (value) {
                query.append(name, value);
            }
        }
        return query.toString();
    }

    // Seule la réponse à la dernière demande s'affiche : une réponse lente ne remplace pas une plus récente.
    let lastRequest = 0;

    async function loadListings() {
        const request = ++lastRequest;
        try {
            const response = await fetch('/api/listings?' + criteriaQuery());
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const inventory = await response.json();
            if (request === lastRequest) {
                showListings(inventory.listings);
            }
        } catch (unavailable) {
            if (request === lastRequest) {
                listingsProblem.hidden = false;
            }
        }
    }

    function showListings(listings) {
        listingsProblem.hidden = true;
        listingCount.textContent = `${listings.length} annonce${listings.length > 1 ? 's' : ''}`;
        // La sélection ne garde que des lignes affichées (US-34).
        const shown = new Set(listings.map(listing => listing.vintedId));
        for (const id of [...selection]) {
            if (!shown.has(id)) {
                selection.delete(id);
            }
        }
        displayedIds = listings.map(listing => listing.vintedId);
        rows.replaceChildren(...listings.map(listing => rowOf(listing)));
        showSelection();
    }

    // Édition en masse des tags (US-34) : identifiants cochés, dans l'ordre d'affichage.
    const selection = new Set();
    let displayedIds = [];
    const selectAll = document.getElementById('select-all');
    const selectionCount = document.getElementById('selection-count');
    const tagName = document.getElementById('tag-name');
    const addTagButton = document.getElementById('add-tag');
    const removeTagButton = document.getElementById('remove-tag');
    const tagEditMessage = document.getElementById('tag-edit-message');
    // Statuts de POST /api/listings/tag-edits -> message ; rien n'est modifié en cas de refus.
    const TAG_EDIT_REFUSALS = {
        400: 'Tag invalide (1 à 30 caractères) : aucun tag modifié',
        404: "Une annonce sélectionnée n'est plus connue : aucun tag modifié"
    };
    const TAG_EDIT_FAILED_MESSAGE = 'Échec de la modification des tags : aucun tag modifié';

    function showSelection() {
        const count = selection.size;
        selectionCount.textContent = `${count} annonce${count > 1 ? 's' : ''} sélectionnée${count > 1 ? 's' : ''}`;
        selectAll.checked = displayedIds.length > 0 && displayedIds.every(id => selection.has(id));
        const disabled = count === 0 || !tagName.value.trim();
        addTagButton.disabled = disabled;
        removeTagButton.disabled = disabled;
        for (const box of rows.querySelectorAll('input[type=checkbox]')) {
            box.checked = selection.has(Number(box.value));
        }
    }

    function selectCell(listing) {
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.value = listing.vintedId;
        box.checked = selection.has(listing.vintedId);
        box.setAttribute('aria-label', 'Sélectionner ' + listing.title);
        box.addEventListener('change', () => {
            if (box.checked) {
                selection.add(listing.vintedId);
            } else {
                selection.delete(listing.vintedId);
            }
            showSelection();
        });
        return cell(box);
    }

    async function editTags(operation) {
        const tag = tagName.value.trim();
        const listingIds = displayedIds.filter(id => selection.has(id));
        addTagButton.disabled = true;
        removeTagButton.disabled = true;
        try {
            const response = await fetch('/api/listings/tag-edits', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({listingIds, tag, operation})
            });
            if (response.ok) {
                const done = operation === 'ADD' ? 'ajouté à' : 'retiré de';
                tagEditMessage.textContent = `Tag « ${tag} » ${done} ${listingIds.length} annonce${listingIds.length > 1 ? 's' : ''}`;
                selection.clear();
                await loadTags();
                loadListings();
            } else {
                tagEditMessage.textContent = TAG_EDIT_REFUSALS[response.status] ?? TAG_EDIT_FAILED_MESSAGE;
            }
        } catch (unreachable) {
            tagEditMessage.textContent = TAG_EDIT_FAILED_MESSAGE;
        }
        showSelection();
    }

    // Tags proposés au filtre ; le tag choisi reste choisi s'il est toujours porté.
    async function loadTags() {
        try {
            const response = await fetch('/api/listing-tags');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const chosen = CRITERIA.tag.value;
            const options = (await response.json()).tags.map(tag => new Option(tag, tag));
            CRITERIA.tag.replaceChildren(new Option('Tous', ''), ...options);
            CRITERIA.tag.value = options.some(option => option.value === chosen) ? chosen : '';
        } catch (unavailable) {
            // Filtre réduit à « Tous » : la liste reste utilisable.
        }
    }

    function cell(...content) {
        const td = document.createElement('td');
        td.append(...content);
        return td;
    }

    function statisticCell(listing, count) {
        const td = cell(listing.statistics ? String(count(listing.statistics)) : '');
        if (listing.statistics) {
            td.title = 'Relevé le ' + dateOf(listing.statistics.readAt);
        }
        return td;
    }

    // US-35 : l'outil conseille, il n'agit pas.
    function adviceCell(listing) {
        const advice = listing.republicationAdvice;
        const td = cell(advice ? 'À republier' : '');
        if (advice) {
            const since = new Date(advice.since).toLocaleDateString('fr-FR');
            td.title = `+${advice.viewsGained} vues depuis le ${since}`;
        }
        return td;
    }

    function backupCell(listing) {
        if (!listing.savedAt) {
            return cell('non sauvegardée');
        }
        const photos = listing.photoCount
            ? ` · ${listing.photoCount} ${listing.photoCount > 1 ? 'photos' : 'photo'}` : '';
        return cell('sauvegardée le ' + dateOf(listing.savedAt) + photos);
    }

    function stageCell(listing) {
        const label = STAGE_LABELS[listing.stage] ?? '';
        if (!STAGES_TO_CHECK.includes(listing.stage)) {
            return cell(label);
        }
        const strong = document.createElement('strong');
        strong.textContent = label;
        return cell(strong);
    }

    function detailLinkOf(listing, text) {
        const link = document.createElement('a');
        link.href = 'listing.html?id=' + encodeURIComponent(listing.vintedId);
        link.textContent = text;
        return link;
    }

    // Bouton « Relancer » des seules étapes qui se relancent, suivi du message de la dernière relance.
    function actionCell(listing, message) {
        const td = cell();
        if (RELAUNCHABLE_STAGES.includes(listing.stage)) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = 'Relancer';
            button.addEventListener('click', () => relaunch(listing, button));
            td.append(button);
        }
        if (message) {
            const span = document.createElement('span');
            span.append(...message);
            td.append(' ', span);
        }
        return td;
    }

    // Une action dont l'annonce reste ou devient « à vérifier » n'a pas d'issue prouvée (US-17).
    function relaunchMessageOf(report) {
        if (report.dryRun) {
            return RELAUNCH_DRY_RUN_MESSAGE;
        }
        if (STAGES_TO_CHECK.includes(report.listing.stage)) {
            return RELAUNCH_UNCERTAIN_MESSAGE;
        }
        return RELAUNCH_DONE_MESSAGES[report.action];
    }

    function refusalMessageOf(listing, refusal) {
        if (refusal.reason === 'NOT_RELAUNCHABLE' && refusal.allowedAt) {
            return [`Republication possible à partir du ${dateOf(refusal.allowedAt)}`];
        }
        let text = RELAUNCH_REFUSAL_MESSAGES[refusal.reason] ?? RELAUNCH_FAILED_MESSAGE;
        if (refusal.allowedAt) {
            text += ` (à partir du ${dateOf(refusal.allowedAt)})`;
        }
        if (refusal.reason === 'ACTION_REFUSED') {
            return [text + ' ', detailLinkOf(listing, 'fiche de l\'annonce')];
        }
        return [text];
    }

    // La ligne relancée est remplacée : nouvelle étape quand l'action a eu lieu, sinon même ligne et raison.
    async function relaunch(listing, button) {
        button.disabled = true;
        const row = button.closest('tr');
        let shown = listing;
        let message;
        try {
            const response = await fetch(`/api/listings/${encodeURIComponent(listing.vintedId)}/relaunch`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({stage: listing.stage})
            });
            const body = await response.json().catch(() => ({}));
            if (response.ok && body.listing) {
                shown = body.listing;
                message = [relaunchMessageOf(body)];
            } else if (response.ok) {
                message = [RELAUNCH_FAILED_MESSAGE];
            } else {
                // Étape changée : la ligne prend l'étape actuelle, d'où repartira le prochain clic.
                if (body.reason === 'STAGE_CHANGED' && body.stage) {
                    shown = {...listing, stage: body.stage};
                }
                message = refusalMessageOf(listing, body);
            }
        } catch (unreachable) {
            message = [RELAUNCH_FAILED_MESSAGE];
        }
        row.replaceWith(rowOf(shown, message));
    }

    // Les titres viennent de Vinted : jamais d'innerHTML. Le titre ouvre la fiche, qui mène à Vinted.
    function rowOf(listing, message) {
        const link = detailLinkOf(listing, listing.title);
        const price = new Intl.NumberFormat('fr-FR', {style: 'currency', currency: listing.price.currency})
            .format(listing.price.amount);
        const row = document.createElement('tr');
        row.append(
            cell(link),
            cell(price),
            statisticCell(listing, statistics => statistics.viewCount),
            statisticCell(listing, statistics => statistics.favouriteCount),
            adviceCell(listing),
            cell(listing.present ? '' : 'absente'),
            backupCell(listing),
            cell(listing.validatedAt ? 'validée le ' + dateOf(listing.validatedAt) : ''),
            stageCell(listing),
            actionCell(listing, message),
            cell((listing.tags ?? []).join(', ')),
            selectCell(listing));
        return row;
    }

    // La réponse donne l'action lancée ; en cas d'échec, refresh affiche le problème.
    async function launch(path) {
        scanButton.hidden = true;
        backupButton.hidden = true;
        statisticsButton.hidden = true;
        try {
            const response = await fetch(path, {method: 'POST'});
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            follow(await response.json());
        } catch (failed) {
            await refresh();
        }
    }

    // Série automatique (US-19) : proposée seulement sans scan, sauvegarde ni série en cours.
    let wardrobeBusy = false;
    let runInProgress = false;

    function showRunButton() {
        runButton.hidden = wardrobeBusy || runInProgress;
    }

    function plural(count, word) {
        return `${count} ${word}${count > 1 ? 's' : ''}`;
    }

    // Annonces de la tournée en cours (US-15) : une seule par défaut.
    function runningSummaryOf(ids) {
        switch (ids?.length ?? 0) {
            case 0:
                return 'Traitement en cours.';
            case 1:
                return `Traitement en cours : annonce ${ids[0]}.`;
            default:
                return `Traitement en cours : annonces ${ids.join(', ')}.`;
        }
    }

    function runSummaryOf(run) {
        switch (run.status) {
            case 'RUNNING':
                return runningSummaryOf(run.currentListingIds);
            case 'WAITING':
                return `En attente jusqu'au ${dateOf(run.waitingUntil)}.`;
            case 'FINISHED':
                return `Traitement terminé : ${plural(run.relaunchCount, 'relance')}, `
                    + `${plural(run.skippedListingIds.length, 'annonce')} écartée${run.skippedListingIds.length > 1 ? 's' : ''}.`;
            case 'PAUSED':
                return 'Traitement en pause.';
            case 'STOPPED':
                return run.stopReason === 'STOPPED_BY_MEMBER' ? 'Traitement arrêté à votre demande.'
                    : `Traitement arrêté : ${RUN_STOP_MESSAGES[run.stopReason] ?? RUN_STOP_MESSAGES.RUN_FAILED}.`;
            default:
                return '';
        }
    }

    // Une demande de pause ou d'arrêt attend la fin de l'action en cours (US-21).
    function requestOf(run) {
        if (run.stopRequested) {
            return " (arrêt demandé, à la fin de l'action en cours)";
        }
        return run.pauseRequested ? " (pause demandée, à la fin de l'action en cours)" : '';
    }

    function showRunControls(run) {
        const active = run.status === 'RUNNING' || run.status === 'WAITING';
        pauseButton.hidden = !active || run.pauseRequested || run.stopRequested;
        resumeButton.hidden = !(run.status === 'PAUSED' || run.pauseRequested) || run.stopRequested;
        stopButton.hidden = !runInProgress || run.stopRequested;
    }

    async function controlRun(control) {
        try {
            const response = await fetch(`/api/automatic-run/${control}`, {method: 'POST'});
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            showRun(await response.json());
        } catch (failed) {
            await refreshRun();
        }
    }

    // La liste est relue pendant la série, et une dernière fois quand elle s'achève.
    function showRun(run) {
        runInProgress = run.status === 'RUNNING' || run.status === 'WAITING' || run.status === 'PAUSED';
        runSummary.textContent = runSummaryOf(run) + requestOf(run);
        showRunButton();
        showRunControls(run);
    }

    function followRun(run) {
        const wasInProgress = runInProgress;
        showRun(run);
        if (wasInProgress || runInProgress) {
            loadListings();
        }
        if (runInProgress) {
            setTimeout(refreshRun, POLL_INTERVAL_MS);
        }
    }

    async function refreshRun() {
        try {
            const response = await fetch('/api/automatic-run');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            followRun(await response.json());
        } catch (unreachable) {
            setTimeout(refreshRun, POLL_INTERVAL_MS);
        }
    }

    async function launchRun() {
        runButton.hidden = true;
        try {
            const response = await fetch('/api/automatic-run', {method: 'POST'});
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            followRun(await response.json());
        } catch (failed) {
            await refreshRun();
        }
    }

    let searchTimer;
    CRITERIA.search.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadListings, SEARCH_DELAY_MS);
    });
    selectAll.addEventListener('change', () => {
        for (const id of displayedIds) {
            if (selectAll.checked) {
                selection.add(id);
            } else {
                selection.delete(id);
            }
        }
        showSelection();
    });
    tagName.addEventListener('input', showSelection);
    addTagButton.addEventListener('click', () => editTags('ADD'));
    removeTagButton.addEventListener('click', () => editTags('REMOVE'));
    loadTags();
    for (const control of [CRITERIA.presence, CRITERIA.backup, CRITERIA.sort, CRITERIA.direction, CRITERIA.tag]) {
        control.addEventListener('change', () => {
            clearTimeout(searchTimer);
            loadListings();
        });
    }
    scanButton.addEventListener('click', () => launch('/api/wardrobe/scan'));
    backupButton.addEventListener('click', () => launch('/api/wardrobe/backup'));
    // Fetch plutôt qu'un simple lien : un refus s'affiche sur la page au lieu d'être téléchargé comme fichier.
    async function downloadArchive() {
        archiveButton.disabled = true;
        try {
            const response = await fetch('/api/data-archive');
            if (!response.ok) {
                const refusal = await response.json().catch(() => ({}));
                showArchiveProblem(ARCHIVE_PROBLEM_MESSAGES[refusal.reason] ?? ARCHIVE_PROBLEM_MESSAGES.ARCHIVE_FAILED);
                return;
            }
            const disposition = response.headers.get('Content-Disposition') ?? '';
            const name = /filename="([^"]+)"/.exec(disposition)?.[1] ?? 'vinted-republisher-archive.zip';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(await response.blob());
            link.download = name;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 0);
            showArchiveProblem('');
        } catch (unreachable) {
            showArchiveProblem("L'application ne répond pas : rien n'a été téléchargé.");
        } finally {
            archiveButton.disabled = false;
        }
    }

    function showArchiveProblem(message) {
        archiveProblem.textContent = message;
        archiveProblem.hidden = !message;
    }

    statisticsButton.addEventListener('click', () => launch('/api/wardrobe/statistics-refresh'));
    archiveButton.addEventListener('click', downloadArchive);
    runButton.addEventListener('click', launchRun);
    pauseButton.addEventListener('click', () => controlRun('pause'));
    resumeButton.addEventListener('click', () => controlRun('resume'));
    stopButton.addEventListener('click', () => controlRun('stop'));
    refresh();
    refreshRun();
</script>
</body>
</html>
