<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sauvegarde d'une annonce</title>
    <style>
        #photos img { max-width: 100%; max-height: 80vh; display: block; margin-bottom: 1em; }
    </style>
</head>
<body>
<p><a href="wardrobe.html">Retour au dressing</a></p>
<h1>Sauvegarde d'une annonce</h1>
<p id="problem" role="alert" hidden></p>
<section id="backup" hidden>
    <div id="verification"></div>
    <p id="saved-at"></p>
    <p id="validated-at"></p>
    <p><button id="validate" type="button" hidden>Valider</button></p>
    <section id="deletion">
        <p id="deletion-mode"></p>
        <p id="deletion-state"></p>
        <p>
            <button id="delete" type="button" hidden>Supprimer de Vinted</button>
            <button id="recheck" type="button" hidden>Revérifier sur Vinted</button>
        </p>
        <div id="deletion-confirmation" role="dialog" hidden>
            <p id="deletion-summary"></p>
            <p>La suppression sur Vinted est irréversible.</p>
            <button id="confirm-deletion" type="button">Supprimer définitivement</button>
            <button id="cancel-deletion" type="button">Annuler</button>
        </div>
    </section>
    <dl id="content"></dl>
    <div id="photos"></div>
</section>
<script>
    const LABELS = [
        ['title', 'Titre'], ['description', 'Description'], ['price', 'Prix'], ['category', 'Catégorie'],
        ['brand', 'Marque'], ['condition', 'État'], ['size', 'Taille'], ['colors', 'Couleurs'],
        ['materials', 'Matières'], ['packageSize', 'Format du colis'], ['isbn', 'ISBN'],
        ['bookTitle', 'Titre du livre'], ['author', 'Auteur'], ['manufacturer', 'Fabricant'],
        ['manufacturerLabel', 'Libellé du fabricant'], ['model', 'Modèle'], ['measurementWidth', 'Largeur'],
        ['measurementLength', 'Longueur'], ['measurementUnit', 'Unité de mesure']
    ];
    const REFUSALS = {
        BACKUP_REPLACED: "La sauvegarde a été remplacée depuis l'ouverture de cette page : rechargez-la pour voir la nouvelle version avant de la valider.",
        VERIFICATION_FAILED: 'La vérification a échoué : rien n\'a été validé.'
    };
    const APPLICATION_DOWN_MESSAGE = "L'application ne répond pas : rechargez la page.";
    const DELETION_REFUSALS = {
        BACKUP_REPLACED: "la sauvegarde a été remplacée depuis l'ouverture de cette page : rechargez-la.",
        NOT_VALIDATED: "la sauvegarde actuelle n'est pas validée.",
        ALREADY_DELETED: 'l\'annonce est déjà supprimée de Vinted.',
        DELETION_UNCONFIRMED: 'la dernière suppression n\'est pas confirmée : revérifiez-la sur Vinted.',
        NO_UNCONFIRMED_DELETION: 'aucune suppression à revérifier.',
        BROWSER_BUSY: 'une autre action est en cours dans le navigateur : réessayez quand elle sera finie.',
        VERIFICATION_FAILED: 'la vérification de la sauvegarde a échoué.',
        LISTING_CHANGED: 'Vinted montre l\'annonce autrement que sa sauvegarde',
        BROWSER_UNAVAILABLE: 'le navigateur est indisponible.',
        VINTED_UNREACHABLE: 'Vinted est inaccessible.',
        SESSION_DISCONNECTED: 'la session Vinted n\'est pas connectée : connectez-vous depuis la page de session.',
        LISTING_PAGE_UNREADABLE: 'la page de l\'annonce sur Vinted n\'est pas celle attendue.'
    };
    const DELETION_FAILED_MESSAGE = "Échec de la suppression : vérifiez l'annonce sur Vinted (détail dans les logs).";
    const RECHECK_FAILED_MESSAGE = 'Revérification impossible, le doute reste : ';
    const DRY_RUN_PASSED = "Dry-run réussi : contrôles réussis, annonce relue sur Vinted, bouton de suppression"
        + " trouvé. Rien n'a été supprimé.";

    const listingId = new URLSearchParams(location.search).get('id');
    const problem = document.getElementById('problem');
    const section = document.getElementById('backup');
    const verification = document.getElementById('verification');
    const savedAt = document.getElementById('saved-at');
    const validatedAt = document.getElementById('validated-at');
    const validateButton = document.getElementById('validate');
    const content = document.getElementById('content');
    const photos = document.getElementById('photos');
    const deletionMode = document.getElementById('deletion-mode');
    const deletionState = document.getElementById('deletion-state');
    const deleteButton = document.getElementById('delete');
    const recheckButton = document.getElementById('recheck');
    const confirmation = document.getElementById('deletion-confirmation');
    const deletionSummary = document.getElementById('deletion-summary');
    const confirmButton = document.getElementById('confirm-deletion');
    const cancelButton = document.getElementById('cancel-deletion');
    let current;

    function priceOf(price) {
        return new Intl.NumberFormat('fr-FR', {style: 'currency', currency: price.currency}).format(price.amount);
    }

    function dateOf(instant) {
        return new Date(instant).toLocaleString('fr-FR');
    }

    function failureOf(failure) {
        switch (failure.kind) {
            case 'NO_PHOTO': return 'aucune photo gardée : refaites la sauvegarde';
            case 'PHOTO_MISSING': return `photo ${failure.rank} manquante sur le disque`;
            case 'PHOTO_ALTERED': return `photo ${failure.rank} modifiée sur le disque depuis sa sauvegarde`;
            case 'LISTING_ABSENT': return 'annonce absente du dressing';
            case 'TITLE_CHANGED':
                return `titre « ${failure.savedTitle} » sauvegardé, « ${failure.scannedTitle} » au dernier scan`;
            case 'PRICE_CHANGED':
                return `prix ${priceOf(failure.savedPrice)} sauvegardé, ${priceOf(failure.scannedPrice)} au dernier scan`;
            default: return failure.kind;
        }
    }

    // Les textes viennent de Vinted : jamais d'innerHTML.
    function showVerification(result) {
        if (result.passed) {
            const passed = document.createElement('p');
            passed.textContent = 'Vérification réussie.';
            verification.replaceChildren(passed);
            return;
        }
        const title = document.createElement('p');
        title.textContent = 'Vérification échouée, la sauvegarde ne peut pas être validée :';
        const list = document.createElement('ul');
        list.replaceChildren(...result.failures.map(failure => {
            const item = document.createElement('li');
            item.textContent = failureOf(failure);
            return item;
        }));
        verification.replaceChildren(title, list);
    }

    function showContent(fields) {
        content.replaceChildren(...LABELS.filter(([key]) => fields[key] !== undefined && fields[key] !== '')
            .flatMap(([key, label]) => {
                const term = document.createElement('dt');
                term.textContent = label;
                const value = document.createElement('dd');
                value.textContent = key === 'price' ? priceOf(fields.price) : String(fields[key]);
                value.style.whiteSpace = 'pre-wrap';
                return [term, value];
            }));
    }

    function showPhotos(kept) {
        photos.replaceChildren(...kept.map(photo => {
            const image = document.createElement('img');
            image.src = photo.url;
            image.alt = photo.rank === 0 ? 'Photo 0 (couverture)' : 'Photo ' + photo.rank;
            return image;
        }));
    }

    function show(view) {
        current = view;
        section.hidden = false;
        problem.hidden = true;
        showVerification(view.verification);
        savedAt.textContent = 'Sauvegardée le ' + dateOf(view.savedAt) + '.';
        validatedAt.textContent = view.validatedAt ? 'Validée le ' + dateOf(view.validatedAt) + '.' : '';
        validateButton.hidden = Boolean(view.validatedAt);
        validateButton.disabled = !view.verification.passed;
        showContent(view.content);
        showPhotos(view.photos);
        showDeletion(view);
    }

    function showDeletion(view) {
        deletionMode.textContent = view.deletionDryRun
            ? 'Dry-run actif : aucune suppression réelle' : 'Suppressions réelles activées';
        confirmation.hidden = true;
        const outcome = view.deletion?.outcome;
        deleteButton.hidden = outcome === 'CONFIRMED';
        deleteButton.disabled = outcome === 'UNCONFIRMED' || !view.validatedAt || !view.verification.passed;
        recheckButton.hidden = outcome !== 'UNCONFIRMED';
        recheckButton.disabled = false;
        if (outcome === 'CONFIRMED') {
            deletionState.textContent = 'Supprimée de Vinted le ' + dateOf(view.deletion.settledAt) + '.';
        } else if (outcome === 'UNCONFIRMED') {
            deletionState.textContent = 'Suppression non confirmée, vérifier sur Vinted.';
        } else {
            deletionState.textContent = view.dryRunPassed ? DRY_RUN_PASSED : '';
        }
    }

    function differenceOf(difference) {
        switch (difference.kind) {
            case 'NOT_ACTIVE': return 'annonce plus active sur Vinted';
            case 'TITLE_CHANGED':
                return `titre « ${difference.savedTitle} » sauvegardé, « ${difference.readTitle} » lu sur Vinted`;
            case 'PRICE_CHANGED':
                return `prix ${priceOf(difference.savedPrice)} sauvegardé, ${priceOf(difference.readPrice)} lu sur Vinted`;
            default: return difference.kind;
        }
    }

    function refusalOf(refusal, recheck) {
        const reason = DELETION_REFUSALS[refusal.reason];
        if (!reason) {
            return recheck ? RECHECK_FAILED_MESSAGE + 'échec inattendu (détail dans les logs).' : DELETION_FAILED_MESSAGE;
        }
        if (recheck) {
            return RECHECK_FAILED_MESSAGE + reason;
        }
        const differences = (refusal.differences ?? []).map(differenceOf).join(' ; ');
        return 'Suppression refusée, rien n\'a été supprimé : ' + reason + (differences ? ' : ' + differences + '.' : '');
    }

    function askConfirmation() {
        const count = current.photos.length;
        deletionSummary.textContent = `« ${current.content.title} », ${priceOf(current.content.price)}, `
            + `${count} photo${count > 1 ? 's' : ''} gardée${count > 1 ? 's' : ''}, sauvegarde validée le `
            + dateOf(current.validatedAt) + '.';
        confirmation.hidden = false;
    }

    async function sendDeletion(path, body) {
        deleteButton.disabled = true;
        recheckButton.disabled = true;
        confirmation.hidden = true;
        const recheck = body === undefined;
        let message = APPLICATION_DOWN_MESSAGE;
        try {
            const response = await fetch('/api/listings/' + encodeURIComponent(listingId) + path, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: recheck ? undefined : JSON.stringify(body)
            });
            if (response.ok) {
                show(await response.json());
                return;
            }
            const refusal = await response.json().catch(() => null);
            if (refusal) {
                message = refusalOf(refusal, recheck);
            }
        } catch (unreachable) {
            // L'application ne répond pas : message par défaut.
        }
        // L'état a pu changer côté application (doute enregistré, vérification échouée) : on le relit.
        await load();
        tell(message);
    }

    function tell(message) {
        problem.textContent = message;
        problem.hidden = false;
    }

    async function load() {
        try {
            const response = await fetch('/api/listings/' + encodeURIComponent(listingId) + '/backup');
            // 400 : identifiant absent ou invalide dans l'adresse de la page.
            if (response.status === 404 || response.status === 400) {
                tell('Aucune sauvegarde pour cette annonce.');
                return;
            }
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            show(await response.json());
        } catch (unreachable) {
            tell(APPLICATION_DOWN_MESSAGE);
        }
    }

    async function validate() {
        validateButton.disabled = true;
        try {
            const response = await fetch('/api/listings/' + encodeURIComponent(listingId) + '/backup/validation', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({savedAt: current.savedAt})
            });
            if (response.ok) {
                show(await response.json());
                return;
            }
            const refusal = response.status === 409 || response.status === 422 ? await response.json() : null;
            // Refusée (version remplacée ou vérification échouée) : rien à revalider avant de recharger la page.
            if (refusal?.verification) {
                showVerification(refusal.verification);
            } else if (!refusal) {
                validateButton.disabled = false;
            }
            tell(REFUSALS[refusal?.reason] ?? APPLICATION_DOWN_MESSAGE);
        } catch (unreachable) {
            validateButton.disabled = false;
            tell(APPLICATION_DOWN_MESSAGE);
        }
    }

    validateButton.addEventListener('click', validate);
    deleteButton.addEventListener('click', askConfirmation);
    cancelButton.addEventListener('click', () => confirmation.hidden = true);
    confirmButton.addEventListener('click', () => sendDeletion('/deletion', {savedAt: current.savedAt}));
    recheckButton.addEventListener('click', () => sendDeletion('/deletion/recheck'));
    load();
</script>
</body>
</html>
