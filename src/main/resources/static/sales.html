<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ventes</title>
</head>
<body>
<p><a href="wardrobe.html">Retour au dressing</a></p>
<h1>Ventes</h1>
<p>Annonces vues « Vendu » dans le dressing, au scan ou au rafraîchissement des vues et favoris. Le prix est le
    dernier lu sur l'annonce, hors frais.</p>
<p id="sales-problem" role="alert" hidden>Ventes indisponibles.</p>
<p id="sales-summary"></p>
<table id="sales" hidden>
    <thead>
    <tr>
        <th scope="col">Constatée le</th>
        <th scope="col">Annonce</th>
        <th scope="col">Prix</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<script>
    const rows = document.querySelector('#sales tbody');
    const summary = document.getElementById('sales-summary');
    const salesProblem = document.getElementById('sales-problem');

    function priceOf(price) {
        return new Intl.NumberFormat('fr-FR', {style: 'currency', currency: price.currency}).format(price.amount);
    }

    function cell(...content) {
        const td = document.createElement('td');
        td.append(...content);
        return td;
    }

    function saleRow(sale) {
        const link = document.createElement('a');
        link.href = 'listing.html?id=' + encodeURIComponent(sale.listingId);
        link.textContent = sale.title;
        const row = document.createElement('tr');
        row.append(cell(new Date(sale.noticedAt).toLocaleString('fr-FR')), cell(link), cell(priceOf(sale.price)));
        return row;
    }

    function summaryOf(overview) {
        const count = overview.sales.length;
        if (count === 0) {
            return 'Aucune vente constatée.';
        }
        return count + (count === 1 ? ' vente' : ' ventes') + ', total ' + overview.totals.map(priceOf).join(' + ')
            + '.';
    }

    async function loadSales() {
        try {
            const response = await fetch('/api/sales');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const overview = await response.json();
            rows.replaceChildren(...overview.sales.map(saleRow));
            document.getElementById('sales').hidden = overview.sales.length === 0;
            summary.textContent = summaryOf(overview);
            salesProblem.hidden = true;
        } catch (unavailable) {
            salesProblem.hidden = false;
        }
    }

    loadSales();
</script>
</body>
</html>
