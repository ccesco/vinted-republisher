openapi: 3.0.3
info:
  title: Vinted Republisher
  description: >
    API de l'IHM de Vinted Republisher (contract first : ce fichier est écrit avant le code,
    les interfaces des contrôleurs en sont générées).
  version: 0.1.0
servers:
  - url: /
tags:
  - name: vinted-session
    description: Session Vinted (US-03)
  - name: wardrobe
    description: Dressing (US-04)
  - name: listing-backup
    description: Sauvegarde d'une annonce et sa validation (US-08)
  - name: listing-deletion
    description: Suppression d'une annonce sur Vinted et mode dry-run (US-09, US-10)
paths:
  /api/vinted-session:
    get:
      tags: [vinted-session]
      operationId: showVintedSession
      summary: État de la session Vinted
      description: Lit l'état mémorisé, sans accéder à Vinted.
      responses:
        '200':
          description: Aperçu de la session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/vinted-session/check:
    post:
      tags: [vinted-session]
      operationId: checkVintedSession
      summary: Vérifier la session
      description: >
        Lance en arrière-plan la vérification (ouverture de la page des paramètres du profil).
        Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Vérification lancée (ou ignorée) ; aperçu de la session juste après la demande, avec l'action
            en cours. Suivre la suite avec GET /api/vinted-session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/vinted-session/login:
    post:
      tags: [vinted-session]
      operationId: logInToVinted
      summary: Se connecter à Vinted
      description: >
        Lance en arrière-plan la connexion manuelle : un onglet Chrome s'ouvre, le membre se connecte
        lui-même (5 minutes au plus). Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Connexion lancée (ou ignorée) ; aperçu de la session juste après la demande, avec l'action
            en cours. Suivre la suite avec GET /api/vinted-session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/wardrobe:
    get:
      tags: [wardrobe]
      operationId: showWardrobe
      summary: Inventaire du dressing
      description: Lit l'inventaire conservé et l'état du scan, sans accéder à Vinted.
      responses:
        '200':
          description: Aperçu du dressing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/wardrobe/scan:
    post:
      tags: [wardrobe]
      operationId: scanWardrobe
      summary: Scanner le dressing
      description: >
        Lance en arrière-plan la lecture du dressing, sans rien modifier sur Vinted.
        Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Scan lancé (ou ignoré) ; aperçu du dressing juste après la demande.
            Suivre la suite avec GET /api/wardrobe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/wardrobe/backup:
    post:
      tags: [wardrobe]
      operationId: backUpWardrobe
      summary: Sauvegarder le contenu des annonces
      description: >
        Lance en arrière-plan la lecture du formulaire de modification de chaque annonce présente, en session
        connectée, sans rien cliquer, saisir ni soumettre. Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Sauvegarde lancée (ou ignorée) ; aperçu du dressing juste après la demande.
            Suivre la suite avec GET /api/wardrobe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/listings/{listingId}/backup:
    get:
      tags: [listing-backup]
      operationId: showListingBackup
      summary: Voir la sauvegarde d'une annonce
      description: >
        Sauvegarde de l'annonce (contenu par ses libellés, photos gardées dans l'ordre), vérifiée à chaque demande :
        photos présentes et intactes, annonce présente dans le dressing, titre et prix identiques au dernier scan.
        Ne contacte pas Vinted.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Sauvegarde de l'annonce et résultat de sa vérification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '404':
          description: L'annonce n'a pas de sauvegarde.
  /api/listings/{listingId}/backup/photos/{rank}:
    get:
      tags: [listing-backup]
      operationId: showListingBackupPhoto
      summary: Voir une photo gardée
      description: Le fichier gardé de la photo, tel qu'il est sur le disque, à l'octet près.
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - name: rank
          in: path
          required: true
          description: Rang de la photo dans l'annonce, 0 pour la couverture.
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: Le fichier de la photo, avec le type sous lequel Vinted l'a servi.
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Pas de sauvegarde, pas de photo à ce rang, ou fichier manquant.
  /api/listings/{listingId}/backup/validation:
    put:
      tags: [listing-backup]
      operationId: validateListingBackup
      summary: Valider la sauvegarde d'une annonce
      description: >
        Le membre confirme la version de la sauvegarde qu'il a vue (savedAt). La vérification est refaite d'abord.
        Valider de nouveau la même version garde la première date de validation. Remplacer la sauvegarde annule
        la validation.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupValidationRequest'
      responses:
        '200':
          description: Sauvegarde validée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '400':
          description: Corps de la demande invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: La sauvegarde a été remplacée depuis l'aperçu ; rouvrir l'aperçu et la revoir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRefusal'
        '422':
          description: La vérification échoue ; rien n'est validé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRefusal'
  /api/listings/{listingId}/deletion:
    post:
      tags: [listing-deletion]
      operationId: deleteListing
      summary: Supprimer une annonce de Vinted
      description: >
        Supprime l'annonce sur Vinted dans le Chrome piloté, comme le membre, seulement si la version de la sauvegarde
        vue (savedAt) est la sauvegarde actuelle, validée, dont la vérification réussit, et si Vinted montre l'annonce
        active, au titre et au prix sauvegardés. Tout refus survient avant le moindre clic. En dry-run (par défaut),
        s'arrête avant le moindre clic de suppression et ne garde rien. Répond une fois l'action finie.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
      responses:
        '200':
          description: >
            Suppression faite (deletion.outcome CONFIRMED), restée dans le doute après le clic de confirmation
            (UNCONFIRMED), ou dry-run réussi (dryRunPassed) ; aperçu à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '400':
          description: Corps de la demande invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: >
            Sauvegarde remplacée depuis l'aperçu, non validée, annonce déjà supprimée, suppression non confirmée à
            revérifier, ou autre action navigateur en cours. Rien n'est touché sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '422':
          description: >
            La vérification de la sauvegarde échoue, ou Vinted montre l'annonce autrement que sa sauvegarde.
            Rien n'est touché sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '500':
          description: Échec inattendu avant le clic de confirmation (détail dans les logs) ; rien n'est supprimé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée ou page de l'annonce illisible, avant
            le clic de confirmation ; rien n'est supprimé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
  /api/listings/{listingId}/deletion/recheck:
    post:
      tags: [listing-deletion]
      operationId: recheckListingDeletion
      summary: Revérifier sur Vinted une suppression non confirmée
      description: >
        Ouvre seulement la page de l'annonce, sans aucun clic. Plus montrée : suppression confirmée. Montrée et active :
        suppression non faite, une nouvelle suppression redevient possible. Sinon le doute reste.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Aperçu à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: Aucune suppression non confirmée, ou autre action navigateur en cours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '500':
          description: Échec inattendu ; le doute reste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '502':
          description: Navigateur indisponible, Vinted inaccessible, session non connectée ou page illisible ; le doute reste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
components:
  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      description: Identifiant de l'annonce sur Vinted.
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    WardrobeOverview:
      type: object
      description: Aperçu du dressing ; un champ absent signifie « aucun ».
      required: [scanInProgress, backupInProgress, listings]
      properties:
        scanInProgress:
          type: boolean
          description: Vrai tant qu'un scan est en cours.
        lastScanAt:
          type: string
          format: date-time
          description: Date de fin du dernier scan terminé ; absente si aucun scan n'est terminé.
        problem:
          $ref: '#/components/schemas/ScanProblem'
        backupInProgress:
          type: boolean
          description: Vrai tant qu'une sauvegarde est en cours.
        lastBackupAt:
          type: string
          format: date-time
          description: Date de fin de la dernière sauvegarde terminée ; absente si aucune n'est terminée.
        backupProblem:
          $ref: '#/components/schemas/BackupProblem'
        listings:
          type: array
          description: Annonces présentes, les plus récentes d'abord ; pendant un scan, peut mêler anciennes et nouvelles valeurs.
          items:
            $ref: '#/components/schemas/Listing'
      example:
        scanInProgress: false
        lastScanAt: '2026-11-06T10:15:30Z'
        backupInProgress: false
        lastBackupAt: '2026-11-07T11:02:10Z'
        listings:
          - vintedId: 90000000001
            title: Pull rayé
            price:
              amount: 1.5
              currency: EUR
            url: https://www.vinted.fr/items/90000000001-pull-raye
            savedAt: '2026-11-07T10:31:45Z'
            photoCount: 3
            statistics:
              viewCount: 12
              favouriteCount: 3
              readAt: '2026-11-07T10:05:00Z'
    Listing:
      type: object
      description: Annonce active du dressing.
      required: [vintedId, title, price, url]
      properties:
        vintedId:
          type: integer
          format: int64
          description: Identifiant de l'annonce sur Vinted.
        title:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        url:
          type: string
          format: uri
          description: Adresse de l'annonce sur Vinted.
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde du contenu de l'annonce ; absente si elle n'a jamais été sauvegardée.
        photoCount:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Nombre de photos gardées avec la sauvegarde de l'annonce ; absent si elle n'a jamais été sauvegardée ou
            si sa sauvegarde date d'avant la conservation des photos.
        statistics:
          $ref: '#/components/schemas/ListingStatistics'
        validatedAt:
          type: string
          format: date-time
          description: Date de validation de la sauvegarde actuelle par le membre ; absente si elle n'est pas validée.
    ListingStatistics:
      type: object
      description: >-
        Dernier relevé des vues et favoris de l'annonce, lus sur sa carte du dressing pendant un scan ; absent si
        l'annonce n'a jamais été relevée (session non connectée, par exemple).
      required: [viewCount, favouriteCount, readAt]
      properties:
        viewCount:
          type: integer
          format: int32
          minimum: 0
        favouriteCount:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de favoris (les « likes » de Vinted).
        readAt:
          type: string
          format: date-time
          description: Fin du relevé du dressing qui a lu ces nombres.
      example:
        viewCount: 12
        favouriteCount: 3
        readAt: '2026-11-11T10:05:00Z'
    Price:
      type: object
      description: Prix affiché sur Vinted, hors frais.
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    ScanProblem:
      type: string
      description: Raison pour laquelle le dernier scan n'a pas abouti.
      enum: [BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, WARDROBE_UNREADABLE, SCAN_FAILED]
    BackupProblem:
      type: string
      description: >
        Raison pour laquelle la dernière sauvegarde n'a pas abouti : navigateur indisponible, Vinted inaccessible,
        session non connectée, annonce illisible, échec de la sauvegarde.
      enum: [BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, SESSION_DISCONNECTED, LISTING_UNREADABLE, BACKUP_FAILED]
    SessionOverview:
      type: object
      description: Aperçu de session ; un champ absent signifie « aucun ».
      properties:
        status:
          $ref: '#/components/schemas/SessionStatus'
        currentAction:
          $ref: '#/components/schemas/BrowserAction'
        problem:
          $ref: '#/components/schemas/SessionProblem'
    SessionStatus:
      type: string
      description: État de session ; absent tant qu'aucune vérification n'a eu lieu (« non vérifié »).
      enum: [CONNECTED, DISCONNECTED]
    BrowserAction:
      type: string
      description: Action navigateur en cours.
      enum: [CHECKING, LOGGING_IN, SCANNING, BACKING_UP, DELETING]
    SessionProblem:
      type: string
      description: Raison pour laquelle la dernière action navigateur n'a pas abouti.
      enum: [MANUAL_LOGIN_NOT_COMPLETED, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE]
    ListingBackupView:
      type: object
      description: Ce que le membre voit de la sauvegarde d'une annonce avant de la valider.
      required: [vintedId, savedAt, verification, content, photos, deletionDryRun]
      properties:
        vintedId:
          type: integer
          format: int64
        deletionDryRun:
          type: boolean
          description: Vrai tant que le dry-run est actif (aucune suppression réelle) ; se règle par DELETION_DRY_RUN.
        dryRunPassed:
          type: boolean
          description: Présent et vrai seulement dans la réponse d'un dry-run réussi ; rien n'a été supprimé.
        deletion:
          $ref: '#/components/schemas/ListingDeletion'
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde ; à renvoyer pour la valider.
        validatedAt:
          type: string
          format: date-time
          description: Date de validation de cette version de la sauvegarde ; absente si elle n'est pas validée.
        verification:
          $ref: '#/components/schemas/BackupVerification'
        content:
          $ref: '#/components/schemas/ListingBackupContent'
        photos:
          type: array
          description: Photos gardées, dans l'ordre de l'annonce (la première est la couverture).
          items:
            $ref: '#/components/schemas/KeptPhoto'
      example:
        vintedId: 10208778166
        savedAt: '2026-11-10T10:00:00Z'
        verification:
          passed: true
          failures: []
        content:
          title: Pull rayé
          description: Porté deux fois
          price: {amount: 12.50, currency: EUR}
          category: Pulls
          brand: Kiabi
          condition: Très bon état
          size: M
          colors: Blanc
          packageSize: Petit
        photos:
          - rank: 0
            url: /api/listings/10208778166/backup/photos/0
    BackupVerification:
      type: object
      description: Vérification de la sauvegarde, refaite à chaque demande ; réussie si aucun échec.
      required: [passed, failures]
      properties:
        passed:
          type: boolean
        failures:
          type: array
          items:
            $ref: '#/components/schemas/VerificationFailure'
    VerificationFailure:
      type: object
      description: >
        Raison pour laquelle la sauvegarde ne permet pas de republier l'annonce : aucune photo, photo manquante,
        photo modifiée, annonce absente du dressing, titre ou prix différent du dernier scan.
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/VerificationFailureKind'
        rank:
          type: integer
          format: int32
          minimum: 0
          description: Rang de la photo, pour PHOTO_MISSING et PHOTO_ALTERED.
        savedTitle:
          type: string
          description: Titre sauvegardé, pour TITLE_CHANGED.
        scannedTitle:
          type: string
          description: Titre lu au dernier scan, pour TITLE_CHANGED.
        savedPrice:
          $ref: '#/components/schemas/Price'
        scannedPrice:
          $ref: '#/components/schemas/Price'
    VerificationFailureKind:
      type: string
      enum: [NO_PHOTO, PHOTO_MISSING, PHOTO_ALTERED, LISTING_ABSENT, TITLE_CHANGED, PRICE_CHANGED]
    ListingBackupContent:
      type: object
      description: Contenu sauvegardé de l'annonce, par ses libellés ; un champ absent n'est pas renseigné.
      required: [title, description, price, category, condition, packageSize]
      properties:
        title:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        category:
          type: string
        brand:
          type: string
        condition:
          type: string
        size:
          type: string
        colors:
          type: string
        materials:
          type: string
        packageSize:
          type: string
        isbn:
          type: string
        bookTitle:
          type: string
        author:
          type: string
        manufacturer:
          type: string
        manufacturerLabel:
          type: string
        model:
          type: string
        measurementWidth:
          type: number
        measurementLength:
          type: number
        measurementUnit:
          type: string
    KeptPhoto:
      type: object
      required: [rank, url]
      properties:
        rank:
          type: integer
          format: int32
          minimum: 0
        url:
          type: string
          description: Adresse du fichier gardé dans l'API.
    BackupValidationRequest:
      type: object
      required: [savedAt]
      properties:
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde que le membre a vue.
    ValidationRefusal:
      type: object
      description: Raison pour laquelle la validation est refusée ; rien n'est validé.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [BACKUP_REPLACED, VERIFICATION_FAILED]
        verification:
          $ref: '#/components/schemas/BackupVerification'
    DeletionRequest:
      type: object
      required: [savedAt]
      properties:
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde que le membre a vue.
    ListingDeletion:
      type: object
      description: Dernière tentative de suppression de l'annonce, arrivée au clic de confirmation dans Vinted.
      required: [outcome, attemptedAt, backupSavedAt]
      properties:
        outcome:
          $ref: '#/components/schemas/DeletionOutcome'
        attemptedAt:
          type: string
          format: date-time
          description: Date du clic de confirmation dans Vinted.
        settledAt:
          type: string
          format: date-time
          description: Date de la preuve ou de la levée du doute ; absente tant que la suppression est non confirmée.
        backupSavedAt:
          type: string
          format: date-time
          description: Version de la sauvegarde sur laquelle s'appuie la suppression.
      example:
        outcome: CONFIRMED
        attemptedAt: '2026-11-11T10:00:00Z'
        settledAt: '2026-11-11T10:00:05Z'
        backupSavedAt: '2026-11-10T10:00:00Z'
    DeletionOutcome:
      type: string
      description: >
        CONFIRMED : Vinted ne montre plus l'annonce. UNCONFIRMED : suppression non confirmée, à revérifier sur Vinted.
        NOT_DONE : l'annonce était toujours là.
      enum: [CONFIRMED, UNCONFIRMED, NOT_DONE]
    DeletionRefusal:
      type: object
      description: Raison pour laquelle la suppression ou la revérification n'a pas eu lieu.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [BACKUP_REPLACED, NOT_VALIDATED, ALREADY_DELETED, DELETION_UNCONFIRMED, NO_UNCONFIRMED_DELETION,
                 BROWSER_BUSY, VERIFICATION_FAILED, LISTING_CHANGED, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE,
                 SESSION_DISCONNECTED, LISTING_PAGE_UNREADABLE, DELETION_FAILED]
        verification:
          $ref: '#/components/schemas/BackupVerification'
        differences:
          type: array
          nullable: true
          description: Écarts entre l'annonce montrée par Vinted et sa sauvegarde ; présent pour LISTING_CHANGED seulement.
          items:
            $ref: '#/components/schemas/ListingDifference'
      example:
        reason: LISTING_CHANGED
        differences:
          - kind: PRICE_CHANGED
            savedPrice: {amount: 12.50, currency: EUR}
            readPrice: {amount: 10.00, currency: EUR}
    ListingDifference:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [NOT_ACTIVE, TITLE_CHANGED, PRICE_CHANGED]
        savedTitle:
          type: string
          description: Titre sauvegardé, pour TITLE_CHANGED.
        readTitle:
          type: string
          description: Titre lu sur Vinted, pour TITLE_CHANGED.
        savedPrice:
          $ref: '#/components/schemas/Price'
        readPrice:
          $ref: '#/components/schemas/Price'
