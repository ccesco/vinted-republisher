openapi: 3.0.3
info:
  title: Vinted Republisher
  description: >
    API de l'IHM de Vinted Republisher (contract first : ce fichier est écrit avant le code,
    les interfaces des contrôleurs en sont générées).
  version: 0.1.0
servers:
  - url: /
tags:
  - name: vinted-session
    description: Session Vinted (US-03)
  - name: wardrobe
    description: Dressing (US-04)
paths:
  /api/vinted-session:
    get:
      tags: [vinted-session]
      operationId: showVintedSession
      summary: État de la session Vinted
      description: Lit l'état mémorisé, sans accéder à Vinted.
      responses:
        '200':
          description: Aperçu de la session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/vinted-session/check:
    post:
      tags: [vinted-session]
      operationId: checkVintedSession
      summary: Vérifier la session
      description: >
        Lance en arrière-plan la vérification (ouverture de la page des paramètres du profil).
        Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Vérification lancée (ou ignorée) ; aperçu de la session juste après la demande, avec l'action
            en cours. Suivre la suite avec GET /api/vinted-session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/vinted-session/login:
    post:
      tags: [vinted-session]
      operationId: logInToVinted
      summary: Se connecter à Vinted
      description: >
        Lance en arrière-plan la connexion manuelle : un onglet Chrome s'ouvre, le membre se connecte
        lui-même (5 minutes au plus). Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Connexion lancée (ou ignorée) ; aperçu de la session juste après la demande, avec l'action
            en cours. Suivre la suite avec GET /api/vinted-session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/wardrobe:
    get:
      tags: [wardrobe]
      operationId: showWardrobe
      summary: Inventaire du dressing
      description: Lit l'inventaire conservé et l'état du scan, sans accéder à Vinted.
      responses:
        '200':
          description: Aperçu du dressing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/wardrobe/scan:
    post:
      tags: [wardrobe]
      operationId: scanWardrobe
      summary: Scanner le dressing
      description: >
        Lance en arrière-plan la lecture du dressing, sans rien modifier sur Vinted.
        Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Scan lancé (ou ignoré) ; aperçu du dressing juste après la demande.
            Suivre la suite avec GET /api/wardrobe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/wardrobe/backup:
    post:
      tags: [wardrobe]
      operationId: backUpWardrobe
      summary: Sauvegarder le contenu des annonces
      description: >
        Lance en arrière-plan la lecture du formulaire de modification de chaque annonce présente, en session
        connectée, sans rien cliquer, saisir ni soumettre. Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Sauvegarde lancée (ou ignorée) ; aperçu du dressing juste après la demande.
            Suivre la suite avec GET /api/wardrobe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
components:
  schemas:
    WardrobeOverview:
      type: object
      description: Aperçu du dressing ; un champ absent signifie « aucun ».
      required: [scanInProgress, backupInProgress, listings]
      properties:
        scanInProgress:
          type: boolean
          description: Vrai tant qu'un scan est en cours.
        lastScanAt:
          type: string
          format: date-time
          description: Date de fin du dernier scan terminé ; absente si aucun scan n'est terminé.
        problem:
          $ref: '#/components/schemas/ScanProblem'
        backupInProgress:
          type: boolean
          description: Vrai tant qu'une sauvegarde est en cours.
        lastBackupAt:
          type: string
          format: date-time
          description: Date de fin de la dernière sauvegarde terminée ; absente si aucune n'est terminée.
        backupProblem:
          $ref: '#/components/schemas/BackupProblem'
        listings:
          type: array
          description: Annonces présentes, les plus récentes d'abord ; pendant un scan, peut mêler anciennes et nouvelles valeurs.
          items:
            $ref: '#/components/schemas/Listing'
      example:
        scanInProgress: false
        lastScanAt: '2026-11-06T10:15:30Z'
        backupInProgress: false
        lastBackupAt: '2026-11-07T11:02:10Z'
        listings:
          - vintedId: 90000000001
            title: Pull rayé
            price:
              amount: 1.5
              currency: EUR
            url: https://www.vinted.fr/items/90000000001-pull-raye
            savedAt: '2026-11-07T10:31:45Z'
            photoCount: 3
            statistics:
              viewCount: 12
              favouriteCount: 3
              readAt: '2026-11-07T10:05:00Z'
    Listing:
      type: object
      description: Annonce active du dressing.
      required: [vintedId, title, price, url]
      properties:
        vintedId:
          type: integer
          format: int64
          description: Identifiant de l'annonce sur Vinted.
        title:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        url:
          type: string
          format: uri
          description: Adresse de l'annonce sur Vinted.
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde du contenu de l'annonce ; absente si elle n'a jamais été sauvegardée.
        photoCount:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Nombre de photos gardées avec la sauvegarde de l'annonce ; absent si elle n'a jamais été sauvegardée ou
            si sa sauvegarde date d'avant la conservation des photos.
        statistics:
          $ref: '#/components/schemas/ListingStatistics'
    ListingStatistics:
      type: object
      description: >-
        Dernier relevé des vues et favoris de l'annonce, lus sur sa carte du dressing pendant un scan ; absent si
        l'annonce n'a jamais été relevée (session non connectée, par exemple).
      required: [viewCount, favouriteCount, readAt]
      properties:
        viewCount:
          type: integer
          format: int32
          minimum: 0
        favouriteCount:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de favoris (les « likes » de Vinted).
        readAt:
          type: string
          format: date-time
          description: Fin du relevé du dressing qui a lu ces nombres.
      example:
        viewCount: 12
        favouriteCount: 3
        readAt: '2026-11-11T10:05:00Z'
    Price:
      type: object
      description: Prix affiché sur Vinted, hors frais.
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    ScanProblem:
      type: string
      description: Raison pour laquelle le dernier scan n'a pas abouti.
      enum: [BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, WARDROBE_UNREADABLE, SCAN_FAILED]
    BackupProblem:
      type: string
      description: >
        Raison pour laquelle la dernière sauvegarde n'a pas abouti : navigateur indisponible, Vinted inaccessible,
        session non connectée, annonce illisible, échec de la sauvegarde.
      enum: [BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, SESSION_DISCONNECTED, LISTING_UNREADABLE, BACKUP_FAILED]
    SessionOverview:
      type: object
      description: Aperçu de session ; un champ absent signifie « aucun ».
      properties:
        status:
          $ref: '#/components/schemas/SessionStatus'
        currentAction:
          $ref: '#/components/schemas/BrowserAction'
        problem:
          $ref: '#/components/schemas/SessionProblem'
    SessionStatus:
      type: string
      description: État de session ; absent tant qu'aucune vérification n'a eu lieu (« non vérifié »).
      enum: [CONNECTED, DISCONNECTED]
    BrowserAction:
      type: string
      description: Action navigateur en cours.
      enum: [CHECKING, LOGGING_IN, SCANNING, BACKING_UP]
    SessionProblem:
      type: string
      description: Raison pour laquelle la dernière action navigateur n'a pas abouti.
      enum: [MANUAL_LOGIN_NOT_COMPLETED, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE]
