openapi: 3.0.3
info:
  title: Vinted Republisher
  description: >
    API de l'IHM de Vinted Republisher (contract first : ce fichier est écrit avant le code,
    les interfaces des contrôleurs en sont générées).
  version: 0.1.0
servers:
  - url: /
tags:
  - name: vinted-session
    description: Session Vinted (US-03)
  - name: wardrobe
    description: Dressing (US-04)
  - name: listing-backup
    description: Sauvegarde d'une annonce et sa validation (US-08)
  - name: listing-deletion
    description: Suppression d'une annonce sur Vinted et mode dry-run (US-09, US-10)
  - name: listing-republication
    description: Republication d'une annonce supprimée depuis sa sauvegarde, et son dry-run (US-12)
  - name: listing-inventory
    description: Liste de toutes les annonces, filtrée, triée et fouillée (US-18)
  - name: listing-detail
    description: Fiche d'une annonce et historique de ses vues et favoris (US-18b)
  - name: action-journal
    description: Journal des actions de l'outil, refus, dry-runs et erreurs compris (US-23)
  - name: listing-relaunch
    description: Relance d'une annonce, d'une étape, depuis la liste (US-20)
  - name: failed-listings
    description: Annonces dont la dernière action a échoué, avec sa cause (US-39)
  - name: listing-tag
    description: Tags posés sur une sélection d'annonces, gardés dans l'outil (US-34)
  - name: automatic-run
    description: Série automatique « Tout lancer » (US-19)
  - name: data-archive
    description: Archive complète des données de l'outil, à télécharger (US-26)
  - name: sales
    description: Ventes constatées dans le dressing (US-36)
  - name: live-preview
    description: Aperçu live de la page de chaque navigateur piloté au travail (US-22)
  - name: backup-verification
    description: Vérification sur Vinted et validation en lot des sauvegardes (US-40)
  - name: duplicates
    description: Doublons du dressing et leur suppression sur Vinted puis de l'outil (US-47)
paths:
  /api/data-archive:
    get:
      tags: [data-archive]
      operationId: downloadDataArchive
      summary: Télécharger une archive des données
      description: >
        Zip de toutes les tables métier (data.json) et de toutes les photos gardées (photos/), sans le profil Chrome.
        Ne modifie rien et n'accède pas à Vinted ; l'outil n'en garde aucune copie. Construite entièrement avant
        l'envoi : jamais de zip tronqué. Tient le navigateur pendant sa construction.
      responses:
        '200':
          description: L'archive, en pièce jointe nommée vinted-republisher-archive-<AAAA-MM-JJTHH-MM-SS>.zip.
          headers:
            Content-Disposition:
              description: attachment; filename="vinted-republisher-archive-<AAAA-MM-JJTHH-MM-SS>.zip"
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '409':
          description: Une action navigateur est en cours (BROWSER_BUSY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataArchiveRefusal'
        '500':
          description: L'archive n'a pas pu être construite (ARCHIVE_FAILED) ; aucun zip envoyé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataArchiveRefusal'
  /api/vinted-session:
    get:
      tags: [vinted-session]
      operationId: showVintedSession
      summary: État de la session Vinted
      description: Lit l'état mémorisé, sans accéder à Vinted.
      responses:
        '200':
          description: Aperçu de la session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/vinted-session/check:
    post:
      tags: [vinted-session]
      operationId: checkVintedSession
      summary: Vérifier la session
      description: >
        Lance en arrière-plan la vérification (ouverture de la page des paramètres du profil).
        Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Vérification lancée (ou ignorée) ; aperçu de la session juste après la demande, avec l'action
            en cours. Suivre la suite avec GET /api/vinted-session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/vinted-session/login:
    post:
      tags: [vinted-session]
      operationId: logInToVinted
      summary: Se connecter à Vinted
      description: >
        Lance en arrière-plan la connexion manuelle : un onglet Chrome s'ouvre, le membre se connecte
        lui-même (5 minutes au plus). Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Connexion lancée (ou ignorée) ; aperçu de la session juste après la demande, avec l'action
            en cours. Suivre la suite avec GET /api/vinted-session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
  /api/wardrobe:
    get:
      tags: [wardrobe]
      operationId: showWardrobe
      summary: Inventaire du dressing
      description: Lit l'inventaire conservé et l'état du scan, sans accéder à Vinted.
      responses:
        '200':
          description: Aperçu du dressing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/wardrobe/scan:
    post:
      tags: [wardrobe]
      operationId: scanWardrobe
      summary: Scanner le dressing
      description: >
        Lance en arrière-plan la lecture du dressing, sans rien modifier sur Vinted.
        Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Scan lancé (ou ignoré) ; aperçu du dressing juste après la demande.
            Suivre la suite avec GET /api/wardrobe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/wardrobe/statistics-refresh:
    post:
      tags: [wardrobe]
      operationId: refreshStatistics
      summary: Rafraîchir les vues et favoris
      description: >
        Lance en arrière-plan un nouveau relevé des vues et favoris de toutes les annonces, lus sur les cartes de la
        page du dressing, sans ouvrir aucune annonce ni rien modifier sur Vinted. Ne change ni les annonces ni les
        scans. Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Rafraîchissement lancé (ou ignoré) ; aperçu du dressing juste après la demande.
            Suivre la suite avec GET /api/wardrobe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/wardrobe/backup:
    post:
      tags: [wardrobe]
      operationId: backUpWardrobe
      summary: Sauvegarder le contenu des annonces
      description: >
        Lance en arrière-plan la lecture du formulaire de modification de chaque annonce présente, en session
        connectée, sans rien cliquer, saisir ni soumettre. Ignorée si une action navigateur est déjà en cours.
      responses:
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '202':
          description: >
            Sauvegarde lancée (ou ignorée) ; aperçu du dressing juste après la demande.
            Suivre la suite avec GET /api/wardrobe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeOverview'
  /api/backup-verifications:
    post:
      tags: [backup-verification]
      operationId: verifyAndValidateBackups
      summary: Vérifier et valider les sauvegardes
      description: >
        Lance en arrière-plan la relecture sur Vinted, une à une avec une pause aléatoire de 5 à 10 s, du formulaire
        de modification des annonces présentes à valider (TO_VALIDATE), en erreur de vérification
        (VERIFICATION_FAILED) ou prêtes à supprimer (TO_DELETE), par identifiant croissant, sans rien cliquer, saisir
        ni soumettre. Chaque sauvegarde est comparée au contenu relu (identifiants et textes, sans les libellés) et
        ses photos contrôlées par leur empreinte : réussie, elle est validée (une validation existante garde sa
        date) ; échouée, l'échec est gardé, la validation éventuelle annulée et l'annonce passe à VERIFICATION_FAILED.
        Une annonce absente (404) échoue et la vérification continue ; une session expirée, une autre réponse
        HTTP ≥ 400 ou un formulaire illisible l'arrêtent, les résultats déjà obtenus restent.
      responses:
        '202':
          description: Vérification lancée ; suivre la suite avec GET /api/backup-verifications/current.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupVerificationProgress'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '409':
          description: >
            Un scan, une sauvegarde, une série « Tout lancer », une vérification ou une autre action navigateur est
            en cours (BROWSER_BUSY) ; rien n'est lancé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupVerificationRefusal'
  /api/backup-verifications/current:
    get:
      tags: [backup-verification]
      operationId: showBackupVerification
      summary: Avancement de la vérification
      description: >
        Lit l'avancement gardé en mémoire de la dernière vérification depuis le démarrage, sans accéder à Vinted ;
        IDLE si aucune.
      responses:
        '200':
          description: Avancement de la vérification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupVerificationProgress'
  /api/listings:
    get:
      tags: [listing-inventory]
      operationId: showListingInventory
      summary: Liste des annonces
      description: >
        Toutes les annonces connues de l'outil qui répondent aux critères, triées ; sans pagination.
        Lit les données conservées, sans accéder à Vinted.
      parameters:
        - name: presence
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PresenceFilter'
        - name: backup
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BackupFilter'
        - name: search
          in: query
          required: false
          description: >
            Texte cherché dans le titre, sans tenir compte de la casse ni des accents ; espaces autour ignorés,
            vide = pas de recherche.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InventorySort'
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortDirection'
        - name: tag
          in: query
          required: false
          description: >
            Tag que les annonces doivent porter, mis en forme comme à l'édition ; vide = pas de filtre (US-34).
          schema:
            type: string
            maxLength: 100
        - name: stage
          in: query
          required: false
          description: Étape des annonces retenues (US-38) ; absente = toutes les étapes.
          schema:
            $ref: '#/components/schemas/ListingStage'
      responses:
        '200':
          description: Annonces retenues, dans l'ordre demandé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingInventory'
        '400':
          description: >
            Valeur de critère inconnue, recherche de plus de 100 caractères, ou tag de plus de 100 caractères
            (30 une fois mis en forme).
  /api/listings/tag-edits:
    post:
      tags: [listing-tag]
      operationId: editListingTags
      summary: Ajouter ou retirer un tag sur une sélection d'annonces
      description: >
        Pose le tag sur chaque annonce sélectionnée (ADD) ou l'en retire (REMOVE), tout ou rien. Le tag est mis en
        forme (espaces autour retirés, espaces intérieurs réduits à un, minuscules) ; un tag déjà porté ou absent ne
        change rien. Gardé dans l'outil seulement, jamais envoyé à Vinted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagEdit'
      responses:
        '204':
          description: Tag ajouté ou retiré sur chaque annonce sélectionnée.
        '400':
          description: Corps invalide, ou tag vide ou de plus de 30 caractères une fois mis en forme ; rien modifié.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: Une annonce sélectionnée est inconnue de l'outil ; rien modifié.
  /api/listing-tags:
    get:
      tags: [listing-tag]
      operationId: showListingTags
      summary: Tags portés par les annonces
      description: Chaque tag porté par au moins une annonce, une fois, par ordre alphabétique.
      responses:
        '200':
          description: Tags portés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingTags'
  /api/listings/{listingId}:
    get:
      tags: [listing-detail]
      operationId: showListingDetail
      summary: Fiche d'une annonce
      description: >
        L'annonce telle que la liste la montre, la date où le scan l'a vue pour la dernière fois et tous ses relevés de
        vues et favoris, du plus récent au plus ancien. Lit les données conservées, sans accéder à Vinted.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Fiche de l'annonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetail'
        '400':
          description: Identifiant qui n'est pas un entier d'au moins 1.
        '404':
          description: Annonce inconnue de l'outil.
  /api/journal:
    get:
      tags: [action-journal]
      operationId: showActionJournal
      summary: Journal des actions
      description: >
        Les actions de l'outil (scans, sauvegardes du dressing, validations, suppressions, revérifications,
        republications) avec leur issue, des plus récentes aux plus anciennes, par pages de 50. Lit les données
        conservées, sans accéder à Vinted.
      parameters:
        - name: before
          in: query
          required: false
          description: Identifiant de la dernière ligne déjà vue ; absent, la page commence par la plus récente.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Une page du journal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionJournal'
        '400':
          description: before qui n'est pas un entier d'au moins 1.
  /api/failed-listings:
    get:
      tags: [failed-listings]
      operationId: showFailedListings
      summary: Annonces en échec
      description: >
        Les annonces dont la dernière action journalisée, hors refus d'attente (cadence, trop tôt, navigateur
        occupé), est un refus, un doute, une revérification non faite ou un échec, avec cette ligne pour cause, de
        la plus récente à la plus ancienne ; hors annonces absentes de Vinted. Lit les données conservées, sans
        accéder à Vinted.
      responses:
        '200':
          description: Les annonces en échec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedListings'
  /api/sales:
    get:
      tags: [sales]
      operationId: showSales
      summary: Ventes constatées
      description: >
        Les annonces connues vues « Vendu » dans le dressing au scan ou au rafraîchissement des statistiques, de la
        plus récemment constatée à la plus ancienne, avec le total des prix par devise. Lit les données conservées,
        sans accéder à Vinted.
      responses:
        '200':
          description: Les ventes et leurs totaux.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOverview'
  /api/duplicates:
    get:
      tags: [duplicates]
      operationId: showDuplicates
      summary: Doublons du dressing
      description: >
        Les groupes d'annonces présentes au dernier scan avec exactement le même titre et le même prix, du groupe
        dont une annonce a été vue en premier le plus récemment au plus ancien. Lit les données conservées, sans
        accéder à Vinted.
      responses:
        '200':
          description: Les groupes de doublons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateGroups'
  /api/live-previews:
    get:
      tags: [live-preview]
      operationId: showLivePreviews
      summary: Aperçus live des navigateurs au travail
      description: >
        Capture, au moment de l'appel, la partie visible de l'onglet où chaque Chrome piloté travaille : un aperçu par
        navigateur, trié par navigateur. Lecture seule : la capture ne navigue pas, ne clique pas et ne saisit rien.
        Ne contacte pas Vinted ; ne démarre pas Chrome.
      responses:
        '200':
          description: Les aperçus, vides si aucun navigateur ne travaille.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivePreviews'
  /api/listings/{listingId}/backup:
    get:
      tags: [listing-backup]
      operationId: showListingBackup
      summary: Voir la sauvegarde d'une annonce
      description: >
        Sauvegarde de l'annonce (contenu par ses libellés, photos gardées dans l'ordre), vérifiée à chaque demande :
        photos présentes et intactes, annonce présente dans le dressing, titre et prix identiques au dernier scan.
        Ne contacte pas Vinted.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Sauvegarde de l'annonce et résultat de sa vérification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '404':
          description: L'annonce n'a pas de sauvegarde.
  /api/listings/{listingId}/backup/photos/{rank}:
    get:
      tags: [listing-backup]
      operationId: showListingBackupPhoto
      summary: Voir une photo gardée
      description: Le fichier gardé de la photo, tel qu'il est sur le disque, à l'octet près.
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - name: rank
          in: path
          required: true
          description: Rang de la photo dans l'annonce, 0 pour la couverture.
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: Le fichier de la photo, avec le type sous lequel Vinted l'a servi.
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Pas de sauvegarde, pas de photo à ce rang, ou fichier manquant.
  /api/listings/{listingId}/backup/validation:
    put:
      tags: [listing-backup]
      operationId: validateListingBackup
      summary: Valider la sauvegarde d'une annonce
      description: >
        Le membre confirme la version de la sauvegarde qu'il a vue (savedAt). La vérification est refaite d'abord.
        Valider de nouveau la même version garde la première date de validation. Remplacer la sauvegarde annule
        la validation.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupValidationRequest'
      responses:
        '200':
          description: Sauvegarde validée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '400':
          description: Corps de la demande invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: La sauvegarde a été remplacée depuis l'aperçu ; rouvrir l'aperçu et la revoir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRefusal'
        '422':
          description: La vérification échoue, ou la dernière vérification sur Vinted de cette version a échoué (US-40, motifs gardés) ; rien n'est validé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRefusal'
  /api/listings/{listingId}/deletion:
    post:
      tags: [listing-deletion]
      operationId: deleteListing
      summary: Supprimer une annonce de Vinted
      description: >
        Supprime l'annonce sur Vinted dans le Chrome piloté, comme le membre, seulement si la version de la sauvegarde
        vue (savedAt) est la sauvegarde actuelle, validée, dont la vérification réussit, et si Vinted montre l'annonce
        active, au titre et au prix sauvegardés. Tout refus survient avant le moindre clic. En dry-run (par défaut),
        s'arrête avant le moindre clic de suppression et ne garde rien. Répond une fois l'action finie.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
      responses:
        '200':
          description: >
            Suppression faite (deletion.outcome CONFIRMED), restée dans le doute après le clic de confirmation
            (UNCONFIRMED), ou dry-run réussi (dryRunPassed) ; aperçu à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '400':
          description: Corps de la demande invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: >
            Sauvegarde remplacée depuis l'aperçu, non validée, annonce déjà supprimée, suppression non confirmée à
            revérifier, ou autre action navigateur en cours. Limite de cadence atteinte
            (US-27, suppression réelle seulement). Rien n'est touché sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '422':
          description: >
            La vérification de la sauvegarde échoue, ou Vinted montre l'annonce autrement que sa sauvegarde.
            Rien n'est touché sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '500':
          description: Échec inattendu avant le clic de confirmation (détail dans les logs) ; rien n'est supprimé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée ou page de l'annonce illisible, avant
            le clic de confirmation ; rien n'est supprimé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
  /api/listings/{listingId}/deletion/recheck:
    post:
      tags: [listing-deletion]
      operationId: recheckListingDeletion
      summary: Revérifier sur Vinted une suppression non confirmée
      description: >
        Ouvre seulement la page de l'annonce, sans aucun clic. Plus montrée : suppression confirmée. Montrée et active :
        suppression non faite, une nouvelle suppression redevient possible. Sinon le doute reste.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Aperçu à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: Aucune suppression non confirmée, ou autre action navigateur en cours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '500':
          description: Échec inattendu ; le doute reste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
        '502':
          description: Navigateur indisponible, Vinted inaccessible, session non connectée ou page illisible ; le doute reste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRefusal'
  /api/listings/{listingId}/duplicate-deletion:
    post:
      tags: [duplicates]
      operationId: deleteDuplicate
      summary: Supprimer un doublon sur Vinted puis de l'outil
      description: >
        Seulement pour une annonce d'un groupe de doublons, sans republication, suppression ni vente. Relit sur
        Vinted une jumelle active au même titre et au même prix, puis le doublon : déjà absent, il est effacé sans
        clic ; sinon, actif au titre et au prix enregistrés, il est supprimé comme le membre, et effacé de l'outil
        (sauvegarde, photos, relevés, prix, tags ; le journal garde ses lignes) une fois que Vinted ne le montre
        plus. En dry-run (par défaut), s'arrête avant le moindre clic et n'efface rien. Répond une fois l'action finie.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: >
            Doublon supprimé et effacé (DELETED), déjà absent de Vinted et effacé (ALREADY_GONE), dry-run réussi
            (DRY_RUN_PASSED), ou suppression non confirmée après le clic (doublon encore montré, échec après la
            confirmation, ou effacement en échec), rien d'effacé (UNCONFIRMED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDeletionReport'
        '400':
          description: Identifiant d'annonce invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: Annonce inconnue de l'outil.
        '409':
          description: >
            Pas un doublon, historique à garder, autre action navigateur en cours sur l'annonce, ou limite de
            cadence des suppressions atteinte (réel seulement). Rien n'est touché sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDeletionRefusal'
        '422':
          description: >
            Aucune jumelle active au même titre et au même prix sur Vinted, ou doublon montré par Vinted autrement
            qu'enregistré. Rien n'est touché sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDeletionRefusal'
        '500':
          description: Échec inattendu avant le clic de confirmation (détail dans les logs) ; rien n'est supprimé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDeletionRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée ou page illisible, avant le clic de
            confirmation ; rien n'est supprimé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDeletionRefusal'
  /api/listings/{listingId}/republication:
    post:
      tags: [listing-republication]
      operationId: republishListing
      summary: Republier sur Vinted une annonce supprimée, depuis sa sauvegarde
      description: >
        Remplit le formulaire de mise en vente dans le Chrome piloté, comme le membre, avec le contenu sauvegardé et
        les photos gardées dans l'ordre, puis publie et retrouve la nouvelle annonce dans le dressing. Seulement si la
        version de la sauvegarde vue (savedAt) est la sauvegarde actuelle, toujours validée, si la dernière suppression
        de l'annonce est confirmée sur cette version, si sa date de republication est atteinte, si les photos gardées
        sont présentes et intactes, et si l'annonce n'a jamais été republiée. Tout refus survient avant d'ouvrir
        Chrome, ou avant le clic sur « Publier ». En dry-run (par défaut), remplit tout le formulaire sans publier ni
        rien garder. Répond une fois l'action finie.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepublicationRequest'
      responses:
        '200':
          description: >
            Republication réussie (republication.outcome PUBLISHED), en erreur de republication après le clic sur
            « Publier » (FAILED), ou dry-run réussi (republicationDryRunPassed) ; aperçu à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '400':
          description: Corps de la demande invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: >
            Sauvegarde remplacée depuis l'aperçu, non validée, annonce sans suppression confirmée de cette version,
            date de republication non atteinte, déjà republiée, en erreur de republication, ou autre action
            navigateur en cours. Limite de cadence atteinte (US-27, republication réelle seulement) : vérifiée
            sous le verrou, avant toute navigation. Chrome n'est pas ouvert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '422':
          description: >
            Photos gardées absentes, manquantes ou modifiées (Chrome n'est pas ouvert), ou champ impossible à remplir
            (rien n'est publié).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '500':
          description: >
            Échec inattendu (détail dans les logs). Avant le clic sur « Publier », rien n'est publié ; après, la
            republication reste en erreur et l'annonce est à vérifier sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée ou formulaire de mise en vente
            illisible, avant le clic sur « Publier » ; rien n'est publié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
  /api/listings/{listingId}/republication/manual:
    post:
      tags: [listing-republication]
      operationId: prepareManualRepublication
      summary: Préparer une republication que le membre publie lui-même (US-45)
      description: >
        Mêmes contrôles que republishListing, sauf le délai après la suppression et la limite de cadence, qui ne
        la refusent jamais ; la préparation compte toutefois dans la cadence des écritures suivantes. Ouvre le formulaire de
        mise en vente dans un nouvel onglet du Chrome piloté, que l'outil laisse ouvert et ne réutilise jamais (il le
        referme si la préparation échoue), et le remplit depuis la sauvegarde ; un champ impossible à remplir est
        laissé vide et le remplissage continue. Ne
        clique jamais sur « Publier ». Enregistre une republication en erreur (FAILED, attemptedAt = date de la
        préparation) : l'annonce passe « Republication à vérifier », jusqu'à verifyListingRepublication ou
        validateListingRepublication. Refusée en dry-run. Répond une fois le formulaire rempli.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepublicationRequest'
      responses:
        '200':
          description: Formulaire rempli, non publié ; champs laissés vides et aperçu à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualRepublicationReport'
        '400':
          description: Corps de la demande invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: >
            Mêmes refus que republishListing, hors délai et cadence (sauvegarde remplacée, non validée, sans
            suppression confirmée, déjà republiée, en erreur de republication, navigateur occupé), ou
            dry-run actif (MANUAL_REPUBLICATION_IN_DRY_RUN). Chrome n'est pas ouvert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '422':
          description: >
            Photos gardées absentes, manquantes ou modifiées (Chrome n'est pas ouvert), ou formulaire sans champ titre
            (FIELD_NOT_FILLABLE, l'onglet est refermé) ; rien n'est enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '500':
          description: Échec inattendu (détail dans les logs) ; rien n'est publié, l'aperçu rechargé fait foi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée ou formulaire de mise en vente
            illisible ; rien n'est publié ni enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
  /api/listings/{listingId}/republication/verification:
    post:
      tags: [listing-republication]
      operationId: verifyListingRepublication
      summary: Vérifier sur Vinted la dernière republication d'une annonce (US-13)
      description: >
        Regarde Vinted dans le Chrome piloté, sans jamais cliquer. Une republication en erreur (FAILED) se lève par une
        lecture des seules annonces affichées à l'ouverture du dressing : une seule annonce avec le titre et le prix de
        la sauvegarde → PUBLISHED, reliée ; aucune ou plusieurs → reste FAILED, le membre la valide alors lui-même
        (manual-validation). Une republication
        réussie (PUBLISHED) est comparée champ par champ à la sauvegarde (republicationComparison), sans rien
        enregistrer ni corriger. Une annonce à relier (US-48 : suppression confirmée, ni republication en erreur ni
        republication réussie) se vérifie par la même lecture : une seule annonce avec le titre et le prix de la
        sauvegarde → republication PUBLISHED enregistrée, datée de la vérification, reliée et comparée ; aucune ou
        plusieurs → rien n'est enregistré, la réponse porte newListingSearch. Répond une fois l'action finie.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Aperçu à jour, avec republicationComparison si la nouvelle annonce a été comparée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: >
            Aucune republication en erreur ou réussie à vérifier, ou autre action navigateur en cours. Chrome n'est
            pas ouvert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '500':
          description: Échec inattendu (détail dans les logs) ; l'aperçu rechargé montre l'état en base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée ou nouvelle annonce illisible
            (LISTING_UNREADABLE). Pendant la lecture du dressing, la republication reste telle qu'elle était ;
            pendant la comparaison, une republication tout juste prouvée reste réussie, seule la comparaison manque.
            L'aperçu rechargé fait foi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
  /api/listings/{listingId}/republication/manual-validation:
    post:
      tags: [listing-republication]
      operationId: validateListingRepublication
      summary: Valider soi-même une republication en erreur (US-13)
      description: >
        Le membre a regardé lui-même sur Vinted. « Publiée » (published true, avec newListingUrl) : l'outil ouvre la
        seule page de la nouvelle annonce, à l'adresse qu'il construit depuis l'identifiant lu dans le lien (jamais
        le lien collé), sans cliquer ; titre et prix de la sauvegarde → PUBLISHED, reliée et comparée, sinon refus.
        « Non publiée » (published false) : NOT_PUBLISHED sans ouvrir Chrome, une nouvelle republication redevient
        possible. Une annonce à relier (US-48) ne se valide que « Publiée » : republication PUBLISHED enregistrée,
        datée de la validation, reliée et comparée ; « Non publiée » y est refusée (NO_REPUBLICATION_TO_VERIFY).
        Répond une fois l'action finie.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepublicationValidation'
      responses:
        '200':
          description: Aperçu à jour, avec republicationComparison si la republication a été validée publiée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBackupView'
        '400':
          description: >
            Lien absent alors que published est vrai, sans identifiant d'annonce, ou lien de l'ancienne annonce ou de
            la nouvelle annonce d'une autre republication (NEW_LISTING_LINK_INVALID). Chrome n'est pas ouvert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: L'annonce n'a pas de sauvegarde.
        '409':
          description: >
            Dernière republication pas en erreur (NO_REPUBLICATION_TO_VERIFY) ou autre action navigateur en cours
            (BROWSER_BUSY), Chrome n'étant pas ouvert ; ou page de la nouvelle annonce avec un autre titre ou un autre
            prix que la sauvegarde (NEW_LISTING_MISMATCH). Rien n'est enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '500':
          description: Échec inattendu (détail dans les logs) ; l'aperçu rechargé montre l'état en base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée ou nouvelle annonce illisible
            (LISTING_UNREADABLE) : la republication reste en erreur. L'aperçu rechargé fait foi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepublicationRefusal'
  /api/listings/{listingId}/relaunch:
    post:
      tags: [listing-relaunch]
      operationId: relaunchListing
      summary: Relancer une annonce d'une étape
      description: >
        Lance l'action qui suit l'étape de l'annonce, seulement si c'est l'étape vue par le membre : suppression
        (TO_DELETE), revérification de la suppression (DELETION_TO_CHECK), republication (TO_REPUBLISH) ou
        vérification de la republication (REPUBLICATION_TO_CHECK), sur la sauvegarde actuelle. L'action passe par
        son propre cas d'usage, avec tous ses contrôles, le verrou du navigateur, les limites de cadence, le dry-run
        et le journal. Répond une fois l'action finie.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelaunchRequest'
      responses:
        '200':
          description: >
            Action finie ou dry-run réussi ; l'annonce relue donne sa nouvelle étape (une action dont l'issue est
            douteuse laisse l'annonce « à vérifier »).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelaunchReport'
        '400':
          description: Corps de la demande invalide.
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
        '404':
          description: Annonce inconnue de l'outil.
        '409':
          description: >
            Étape changée depuis l'affichage, étape sans action à lancer, limite de cadence atteinte, autre action
            navigateur en cours, ou refus du cas d'usage lancé (détail sur la fiche et dans le journal). Rien n'est
            touché sur Vinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelaunchRefusal'
        '500':
          description: >
            Échec inattendu (détail dans les logs) ; la fiche fait foi avant de relancer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelaunchRefusal'
        '502':
          description: >
            Navigateur indisponible, Vinted inaccessible, session non connectée, ou page de Vinted illisible
            (annonce, formulaire de mise en vente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelaunchRefusal'
  /api/automatic-run:
    get:
      tags: [automatic-run]
      operationId: showAutomaticRun
      summary: Aperçu de la série automatique
      description: Lit l'aperçu gardé en mémoire, sans accéder à Vinted ; IDLE si aucune série depuis le démarrage.
      responses:
        '200':
          description: Aperçu de la série.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomaticRunOverview'
    post:
      tags: [automatic-run]
      operationId: launchAutomaticRun
      summary: Tout lancer
      description: >
        Lance en arrière-plan la relance de chaque annonce prête, l'une après l'autre (vérifications, republications,
        suppressions, attentes), avec les garde-fous de chaque relance. Attend quand un échec le demande, écarte une
        annonce refusée pour elle-même ou dont l'étape ne bouge pas, s'arrête sur un problème du compte ou de Vinted.
        Ignorée si une série tourne déjà. Ne redémarre jamais seule.
      responses:
        '202':
          description: Série lancée (ou ignorée) ; aperçu juste après la demande. Suivre la suite avec GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomaticRunOverview'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
  /api/automatic-run/queue:
    get:
      tags: [automatic-run]
      operationId: showRunQueue
      summary: File d'attente de la série
      description: >
        Prévoit, à l'heure du serveur, les actions que la série lancerait, dans leur ordre de passage, avec leur heure
        au plus tôt : cadence d'écriture (écritures faites, en cours et prévues avant), délai de republication (une
        suppression réelle est suivie de la republication de son annonce), dry-run (sans cadence ni suite). Chaque
        action est supposée instantanée. Hors annonces écartées par la série en cours. Lit les données conservées,
        sans accéder à Vinted ni rien enregistrer.
      responses:
        '200':
          description: La file prévue, vide si la série n'a rien à faire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunQueue'
  /api/automatic-run/pause:
    post:
      tags: [automatic-run]
      operationId: pauseAutomaticRun
      summary: Mettre la série en pause
      description: >
        La relance en cours se termine, puis la série passe en pause ; une attente en cours est interrompue. Ignorée
        sans série en cours, ou déjà en pause.
      responses:
        '202':
          description: Demande prise en compte (ou ignorée) ; aperçu juste après la demande.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomaticRunOverview'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
  /api/automatic-run/resume:
    post:
      tags: [automatic-run]
      operationId: resumeAutomaticRun
      summary: Reprendre la série en pause
      description: La série reprend au tour suivant. Ignorée sans pause en cours ni demandée.
      responses:
        '202':
          description: Demande prise en compte (ou ignorée) ; aperçu juste après la demande.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomaticRunOverview'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
  /api/automatic-run/stop:
    post:
      tags: [automatic-run]
      operationId: stopAutomaticRun
      summary: Arrêter la série
      description: >
        La relance en cours se termine, puis la série s'arrête (STOPPED_BY_MEMBER) ; une attente ou une pause est
        interrompue. Ignorée sans série en cours.
      responses:
        '202':
          description: Demande prise en compte (ou ignorée) ; aperçu juste après la demande.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomaticRunOverview'
        '403':
          description: Demande venue d'un autre site que l'application, refusée.
components:
  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      description: Identifiant de l'annonce sur Vinted.
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    WardrobeOverview:
      type: object
      description: Aperçu du dressing ; un champ absent signifie « aucun ».
      required: [scanInProgress, backupInProgress, statisticsRefreshInProgress]
      properties:
        scanInProgress:
          type: boolean
          description: Vrai tant qu'un scan est en cours.
        lastScanAt:
          type: string
          format: date-time
          description: Date de fin du dernier scan terminé ; absente si aucun scan n'est terminé.
        problem:
          $ref: '#/components/schemas/ScanProblem'
        backupInProgress:
          type: boolean
          description: Vrai tant qu'une sauvegarde est en cours.
        lastBackupAt:
          type: string
          format: date-time
          description: Date de fin de la dernière sauvegarde terminée ; absente si aucune n'est terminée.
        backupProblem:
          $ref: '#/components/schemas/BackupProblem'
        statisticsRefreshInProgress:
          type: boolean
          description: Vrai tant qu'un rafraîchissement des vues et favoris est en cours.
        lastStatisticsReadAt:
          type: string
          format: date-time
          description: Date du relevé de vues et favoris le plus récent, par un scan ou un rafraîchissement ; absente si aucun.
        statisticsRefreshProblem:
          $ref: '#/components/schemas/StatisticsRefreshProblem'
      example:
        scanInProgress: false
        lastScanAt: '2026-11-06T10:15:30Z'
        backupInProgress: false
        lastBackupAt: '2026-11-07T11:02:10Z'
        statisticsRefreshInProgress: false
        lastStatisticsReadAt: '2026-11-17T09:40:00Z'
    ListingInventory:
      type: object
      description: Annonces qui répondent aux critères, dans l'ordre demandé.
      required: [listings]
      properties:
        listings:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
      example:
        listings:
          - vintedId: 90000000001
            title: Pull rayé
            price:
              amount: 1.5
              currency: EUR
            url: https://www.vinted.fr/items/90000000001-pull-raye
            present: true
            savedAt: '2026-11-07T10:31:45Z'
            photoCount: 3
            statistics:
              viewCount: 12
              favouriteCount: 3
              readAt: '2026-11-07T10:05:00Z'
    SalesOverview:
      type: object
      description: Les ventes constatées, la plus récente d'abord, et le total de leurs prix dans chaque devise.
      required: [sales, totals]
      properties:
        sales:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        totals:
          type: array
          description: Un total par devise, trié par devise, sans change ; vide sans vente.
          items:
            $ref: '#/components/schemas/Price'
      example:
        sales:
          - listingId: 90000000002
            title: Jean
            price: {amount: 25.5, currency: EUR}
            noticedAt: '2026-11-17T10:00:00Z'
        totals:
          - {amount: 25.5, currency: EUR}
    Sale:
      type: object
      description: >
        Annonce connue vue « Vendu » dans le dressing ; jamais modifiée ni supprimée. Le prix est le dernier lu sur
        l'annonce (prix affiché, hors frais), pas le montant encaissé.
      required: [listingId, title, price, noticedAt]
      properties:
        listingId:
          type: integer
          format: int64
        title:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        noticedAt:
          type: string
          format: date-time
          description: Date du premier relevé du dressing qui l'a montrée vendue, pas la date réelle de la vente.
    LivePreviews:
      type: object
      description: Un aperçu par onglet de travail d'un Chrome piloté, trié par navigateur.
      required: [previews]
      properties:
        previews:
          type: array
          items:
            $ref: '#/components/schemas/LivePreview'
      example:
        previews:
          - browser: Chrome (port 9222)
            image: /9j/4AAQSkZJRg==
            capturedAt: '2026-11-18T10:00:00Z'
    LivePreview:
      type: object
      description: >
        Ce que montre l'onglet de travail d'un navigateur piloté. image et capturedAt sont présents ensemble, absents
        si la capture a échoué (onglet fermé entre-temps, fenêtre réduite, Chrome sans réponse en 3 secondes).
      required: [browser]
      properties:
        browser:
          type: string
          description: Nom du navigateur, par son port de débogage.
          example: Chrome (port 9222)
        image:
          type: string
          format: byte
          description: Capture JPEG de la partie visible de la page, en base64.
        capturedAt:
          type: string
          format: date-time
    ActionJournal:
      type: object
      description: Une page du journal, des lignes les plus récentes aux plus anciennes.
      required: [entries, hasMore]
      properties:
        entries:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/JournalEntry'
        hasMore:
          type: boolean
          description: Vrai s'il reste des lignes plus anciennes (à demander avec before = entryId de la dernière ligne).
    JournalEntry:
      type: object
      description: Une action de l'outil et son issue ; jamais modifiée ni supprimée.
      required: [entryId, occurredAt, action, outcome]
      properties:
        entryId:
          type: integer
          format: int64
          description: Identifiant de la ligne, croissant dans l'ordre d'écriture.
        occurredAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/JournaledAction'
        outcome:
          $ref: '#/components/schemas/ActionOutcome'
        listingId:
          type: integer
          format: int64
          description: Annonce concernée ; absente pour le scan et la sauvegarde du dressing.
        listingTitle:
          type: string
          description: Titre actuel de l'annonce concernée ; absent sans annonce ou si l'outil ne la connaît pas.
        reason:
          type: string
          description: >
            Raison, avec le même code que la réponse de l'API (refus de suppression, de republication ou de
            validation, problème du scan ou de la sauvegarde) ; absente sans raison.
      example:
        entryId: 42
        occurredAt: '2026-11-15T10:00:00Z'
        action: DELETION
        outcome: REFUSED
        listingId: 90000000001
        listingTitle: Pull rayé
        reason: NOT_VALIDATED
    RunQueue:
      type: object
      description: File d'attente prévue de la série, dans l'ordre de passage.
      required: [computedAt, actions]
      properties:
        computedAt:
          type: string
          format: date-time
          description: Heure du serveur à laquelle la file a été prévue.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/QueuedAction'
      example:
        computedAt: '2026-11-19T10:00:00Z'
        actions:
          - listingId: 10208778166
            listingTitle: Chaussons bébé
            action: DELETION
            earliestAt: '2026-11-19T10:00:00Z'
            dryRun: false
          - listingId: 10208778166
            listingTitle: Chaussons bébé
            action: REPUBLICATION
            earliestAt: '2026-11-19T10:05:00Z'
            dryRun: false
    QueuedAction:
      type: object
      description: Action que la série lancerait, avec son heure au plus tôt.
      required: [listingId, listingTitle, action, earliestAt, dryRun]
      properties:
        listingId:
          type: integer
          format: int64
        listingTitle:
          type: string
        action:
          $ref: '#/components/schemas/RelaunchAction'
        earliestAt:
          type: string
          format: date-time
          description: Heure au plus tôt ; au plus la date du calcul si l'action peut partir tout de suite.
        dryRun:
          type: boolean
          description: Écriture en dry-run (rien n'est écrit sur Vinted, la série écartera ensuite l'annonce).
    FailedListings:
      type: object
      description: Les annonces en échec, de l'échec le plus récent au plus ancien.
      required: [listings]
      properties:
        listings:
          type: array
          items:
            $ref: '#/components/schemas/FailedListing'
    FailedListing:
      type: object
      description: >
        Annonce dont la dernière ligne du journal (refus d'attente ignorés) est un refus, un doute, une
        revérification non faite ou un échec ; cette ligne en donne la cause. Jamais une annonce absente de Vinted ni
        une annonce republiée (US-45).
      required: [listingId, listingTitle, stage, kind, failure]
      properties:
        listingId:
          type: integer
          format: int64
        listingTitle:
          type: string
        stage:
          $ref: '#/components/schemas/ListingStage'
        kind:
          $ref: '#/components/schemas/FailureKind'
        failure:
          $ref: '#/components/schemas/JournalEntry'
    FailureKind:
      type: string
      description: >
        Groupe de l'échec, d'après l'issue de sa ligne du journal (US-45) : IN_DOUBT (doute, à vérifier), REFUSED
        (refus, hors refus d'attente), OTHER (échec ou revérification non faite, à relancer une fois le problème réglé).
      enum: [IN_DOUBT, REFUSED, OTHER]
    ManualRepublicationReport:
      type: object
      description: Republication manuelle préparée (US-45) ; le membre complète les champs laissés vides puis publie.
      required: [listing, unfilledFields]
      properties:
        listing:
          $ref: '#/components/schemas/ListingBackupView'
        unfilledFields:
          type: array
          description: >
            Champs laissés vides, chacun une fois, dans l'ordre du formulaire, puis les détails jamais observés
            (ISBN, auteur…) ; vide si tout a été rempli.
          items:
            $ref: '#/components/schemas/UnfilledField'
    UnfilledField:
      type: object
      required: [field]
      properties:
        field:
          $ref: '#/components/schemas/ListingFormField'
        optionId:
          type: integer
          format: int64
          description: Identifiant Vinted de l'option introuvable, quand il y en a une.
      example:
        field: SIZE
        optionId: 588
    JournaledAction:
      type: string
      description: >
        Action journalisée : scan du dressing, sauvegarde du dressing, validation d'une sauvegarde, vérification
        d'une sauvegarde sur Vinted (US-40), suppression,
        revérification d'une suppression, republication, vérification d'une republication sur Vinted et validation
        manuelle d'une republication (US-44), rafraîchissement des vues et favoris, suppression d'un doublon (US-47).
      enum: [SCAN, WARDROBE_BACKUP, BACKUP_VALIDATION, BACKUP_VERIFICATION, DELETION, DELETION_RECHECK, REPUBLICATION, REPUBLICATION_VERIFICATION, REPUBLICATION_VALIDATION, STATISTICS_REFRESH, DUPLICATE_DELETION]
    ActionOutcome:
      type: string
      description: >
        Issue : lancée (scan, sauvegarde du dressing), réussie, dry-run réussi, refusée, dans le doute (suppression
        non confirmée, erreur de republication), non faite (revérification), en échec.
      enum: [STARTED, SUCCEEDED, DRY_RUN, REFUSED, IN_DOUBT, NOT_DONE, FAILED]
    ListingDetail:
      type: object
      description: Fiche d'une annonce.
      required: [listing, firstSeenAt, lastSeenAt, statisticsHistory, journal, priceHistory, lifecycle,
                 duplicateTwinIds, deletableAsDuplicate, deletionDryRun]
      properties:
        listing:
          $ref: '#/components/schemas/Listing'
        firstSeenAt:
          type: string
          format: date-time
          description: >
            Première fois que l'outil a vu l'annonce (scan, ou republication qui l'a trouvée), jamais modifiée ;
            approximative pour une annonce connue avant le suivi de cette date.
        lastSeenAt:
          type: string
          format: date-time
          description: Dernière fois que le scan a vu l'annonce dans le dressing.
        lifecycle:
          type: array
          description: >
            Cycle de vie de l'article : événements établis de toutes les annonces reliées par des republications
            publiées, la plus ancienne d'abord ; jamais vide (au moins la première détection de l'annonce).
          items:
            $ref: '#/components/schemas/LifecycleEvent'
        statisticsHistory:
          type: array
          description: Tous les relevés de vues et favoris de l'annonce, du plus récent au plus ancien ; vide si jamais relevée.
          items:
            $ref: '#/components/schemas/ListingStatistics'
        journal:
          type: array
          description: Toutes les lignes du journal de l'annonce, de la plus récente à la plus ancienne ; vide si aucune.
          items:
            $ref: '#/components/schemas/JournalEntry'
        statisticsComparison:
          $ref: '#/components/schemas/StatisticsComparison'
        lastVerification:
          $ref: '#/components/schemas/VerificationResult'
        priceHistory:
          type: array
          description: >
            Tous les prix de l'annonce, du plus récent au plus ancien ; vide tant que l'annonce n'a pas été enregistrée
            depuis le début de l'historique de prix (US-33).
          items:
            $ref: '#/components/schemas/PriceChange'
        duplicateTwinIds:
          type: array
          description: >
            Les autres annonces présentes de même titre et même prix (US-47), par identifiant croissant ; vide si
            l'annonce n'est dans aucun groupe de doublons.
          items:
            type: integer
            format: int64
        deletableAsDuplicate:
          type: boolean
          description: L'annonce peut être supprimée comme doublon (groupe de doublons, sans historique à garder).
        deletionDryRun:
          type: boolean
          description: Le dry-run des suppressions est actif ; une suppression de doublon ne clique ni n'efface rien.
      example:
        listing:
          vintedId: 90000000001
          title: Pull rayé
          price:
            amount: 1.5
            currency: EUR
          url: https://www.vinted.fr/items/90000000001-pull-raye
          present: true
          statistics:
            viewCount: 12
            favouriteCount: 3
            readAt: '2026-11-07T10:05:00Z'
        firstSeenAt: '2026-11-06T10:05:00Z'
        lastSeenAt: '2026-11-07T10:05:00Z'
        statisticsHistory:
          - viewCount: 12
            favouriteCount: 3
            readAt: '2026-11-07T10:05:00Z'
          - viewCount: 5
            favouriteCount: 1
            readAt: '2026-11-06T10:05:00Z'
        priceHistory:
          - price: {amount: 1.5, currency: EUR}
            changedAt: '2026-11-07T10:05:00Z'
          - price: {amount: 2, currency: EUR}
            changedAt: '2026-11-06T10:05:00Z'
        lifecycle:
          - type: FIRST_SEEN
            listingId: 90000000001
            at: '2026-11-06T10:05:00Z'
        duplicateTwinIds: []
        deletableAsDuplicate: false
        deletionDryRun: true
    PriceChange:
      type: object
      description: Un prix de l'annonce et la date où l'outil l'a vu pour la première fois.
      required: [price, changedAt]
      properties:
        price:
          $ref: '#/components/schemas/Price'
        changedAt:
          type: string
          format: date-time
          description: Date de l'enregistrement de l'annonce (scan, republication) qui a vu ce prix pour la première fois.
    LifecycleEvent:
      type: object
      description: Un fait établi de la vie d'une annonce de l'article.
      required: [type, listingId, at]
      properties:
        type:
          $ref: '#/components/schemas/LifecycleEventType'
        listingId:
          type: integer
          format: int64
          description: Identifiant Vinted de l'annonce concernée.
        at:
          type: string
          format: date-time
          description: >
            Première détection, clic de suppression, preuve de la republication, ou dernière vue pour une sortie du
            dressing.
        newListingId:
          type: integer
          format: int64
          description: Identifiant Vinted de la nouvelle annonce ; seulement pour une republication.
      example:
        type: REPUBLISHED
        listingId: 90000000001
        at: '2026-11-10T09:00:00Z'
        newListingId: 90000000002
    LifecycleEventType:
      type: string
      description: >
        Vue pour la première fois, supprimée par l'outil (suppression confirmée), republiée (republication publiée),
        sortie du dressing (absente sans suppression confirmée : vendue ou retirée hors de l'outil).
      enum: [FIRST_SEEN, DELETED, REPUBLISHED, LEFT_WARDROBE]
    StatisticsComparison:
      type: object
      description: >
        Vues et favoris d'une annonce issue d'une republication, à côté de ceux de l'annonce qu'elle remplace ; absent
        de la fiche d'une annonce qui ne vient pas d'une republication publiée.
      required: [previousListingId, republishedAt, cumulatedViewCount, cumulatedFavouriteCount, previousListingCount]
      properties:
        previousListingId:
          type: integer
          format: int64
          description: Identifiant Vinted de l'annonce remplacée directement.
        republishedAt:
          type: string
          format: date-time
          description: Date où la nouvelle annonce a été trouvée sur Vinted.
        before:
          $ref: '#/components/schemas/ListingStatistics'
        after:
          $ref: '#/components/schemas/ListingStatistics'
        cumulatedViewCount:
          type: integer
          format: int32
          minimum: 0
          description: Somme des vues des derniers relevés de toutes les annonces de la chaîne, celle-ci comprise.
        cumulatedFavouriteCount:
          type: integer
          format: int32
          minimum: 0
          description: Somme des favoris des derniers relevés de toutes les annonces de la chaîne, celle-ci comprise.
        previousListingCount:
          type: integer
          format: int32
          minimum: 1
          description: Nombre d'annonces qui ont précédé celle-ci (une par republication).
      example:
        previousListingId: 90000000001
        republishedAt: '2026-11-10T09:00:00Z'
        before:
          viewCount: 120
          favouriteCount: 8
          readAt: '2026-11-09T09:00:00Z'
        after:
          viewCount: 30
          favouriteCount: 4
          readAt: '2026-11-15T09:00:00Z'
        cumulatedViewCount: 150
        cumulatedFavouriteCount: 12
        previousListingCount: 1
    PresenceFilter:
      type: string
      description: >
        Présence dans le dressing : présentes (défaut), absentes (plus vues au dernier scan terminé), toutes.
      enum: [PRESENT, ABSENT, ALL]
      default: PRESENT
    BackupFilter:
      type: string
      description: >
        État de la sauvegarde : toutes (défaut), jamais sauvegardées, sauvegardées dont la sauvegarde actuelle n'est
        pas validée, sauvegarde actuelle validée, vérification sur Vinted de la sauvegarde actuelle en erreur (US-40).
      enum: [ALL, NOT_BACKED_UP, NOT_VALIDATED, VALIDATED, VERIFICATION_FAILED]
      default: ALL
    InventorySort:
      type: string
      description: >
        Critère de tri : ordre de mise en ligne (identifiant Vinted, défaut), titre, prix, vues, favoris, date de
        sauvegarde. Une annonce sans la valeur triée finit la liste quel que soit le sens ; à égalité, la plus récente
        d'abord.
      enum: [RECENCY, TITLE, PRICE, VIEWS, FAVOURITES, SAVED_AT]
      default: RECENCY
    SortDirection:
      type: string
      description: Sens du tri, décroissant par défaut.
      enum: [ASC, DESC]
      default: DESC
    Listing:
      type: object
      description: Annonce connue de l'outil.
      required: [vintedId, title, price, url, present, stage]
      properties:
        vintedId:
          type: integer
          format: int64
          description: Identifiant de l'annonce sur Vinted.
        title:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        url:
          type: string
          format: uri
          description: Adresse de l'annonce sur Vinted.
        present:
          type: boolean
          description: Vrai si l'annonce était dans le dressing au dernier scan terminé ; fausse, elle est absente.
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde du contenu de l'annonce ; absente si elle n'a jamais été sauvegardée.
        photoCount:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Nombre de photos gardées avec la sauvegarde de l'annonce ; absent si elle n'a jamais été sauvegardée ou
            si sa sauvegarde date d'avant la conservation des photos.
        statistics:
          $ref: '#/components/schemas/ListingStatistics'
        validatedAt:
          type: string
          format: date-time
          description: Date de validation de la sauvegarde actuelle par le membre ; absente si elle n'est pas validée.
        stage:
          $ref: '#/components/schemas/ListingStage'
        republicationAdvice:
          $ref: '#/components/schemas/RepublicationAdvice'
        republication:
          allOf:
            - $ref: '#/components/schemas/ListingRepublication'
          description: >
            Republication qui fixe l'étape (US-38) : présente seulement si l'annonce est republiée ou sa
            republication à vérifier ; rendue par la liste, absente de la fiche et de la relance.
        tags:
          type: array
          items:
            type: string
          description: >
            Tags portés par l'annonce, par ordre alphabétique (US-34) ; toujours rendu par la liste (vide si aucun),
            absent de la fiche et de la relance.
        republicationTally:
          allOf:
            - $ref: '#/components/schemas/RepublicationTally'
          description: >
            Compteur de republications de l'article (US-44) ; toujours rendu par la liste (zéros compris), absent de
            la fiche et de la relance.
    RepublicationTally:
      type: object
      description: >
        Republications de tout l'article, sur toutes les annonces de sa chaîne de republications publiées, dans les
        deux sens : la même valeur pour chaque annonce de l'article.
      required: [published, notPublished]
      properties:
        published:
          type: integer
          format: int32
          minimum: 0
          description: Republications publiées (PUBLISHED), retrouvées par l'outil ou validées par le membre.
        notPublished:
          type: integer
          format: int32
          minimum: 0
          description: >
            Tentatives constatées non publiées sur Vinted (NOT_PUBLISHED) ; une tentative en erreur encore à vérifier
            (FAILED) n'est pas comptée.
      example:
        published: 2
        notPublished: 1
    RepublicationAdvice:
      type: object
      description: >
        Conseil de republier une annonce en vente (à sauvegarder, à valider ou prête à supprimer) qui ne se voit
        presque plus : moins de 10 vues gagnées depuis son dernier relevé d'il y a au moins 7 jours, relevé de moins
        de 7 jours, moins de 5 favoris. Absent si l'annonce n'est pas conseillée ; l'outil conseille, il n'agit pas.
      required: [viewsGained, since]
      properties:
        viewsGained:
          type: integer
          format: int32
          minimum: 0
          description: Vues gagnées depuis le relevé de référence (zéro si elles ont baissé).
        since:
          type: string
          format: date-time
          description: Date du relevé de référence, le dernier fait il y a au moins 7 jours.
      example:
        viewsGained: 6
        since: '2026-11-08T10:00:00Z'
    TagEdit:
      type: object
      description: Tag à ajouter à, ou retirer de, chaque annonce sélectionnée.
      required: [listingIds, tag, operation]
      properties:
        listingIds:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
            minimum: 1
          description: Identifiants Vinted des annonces sélectionnées ; une annonce en double compte une fois.
        tag:
          type: string
          minLength: 1
          maxLength: 100
          description: Tag saisi ; 30 caractères au plus une fois mis en forme.
        operation:
          $ref: '#/components/schemas/TagOperation'
      example:
        listingIds: [90000000001, 90000000002]
        tag: été
        operation: ADD
    TagOperation:
      type: string
      description: Ajouter le tag, ou le retirer.
      enum: [ADD, REMOVE]
    ListingTags:
      type: object
      description: Tags portés par au moins une annonce, par ordre alphabétique.
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string
      example:
        tags: [été, lot]
    ListingStage:
      type: string
      description: >
        Étape de traitement de l'annonce, déduite à chaque lecture (la première règle qui s'applique) : republiée,
        republication à vérifier (en erreur), suppression à vérifier (non confirmée), en attente avant
        republication (suppression confirmée, délai minimal pas écoulé), à republier, vendue (vente constatée,
        US-50), absente de Vinted (sans suppression confirmée), prête à supprimer (sauvegarde actuelle validée),
        vérification en erreur (dernière vérification sur Vinted de la sauvegarde actuelle échouée, US-40), à valider,
        à sauvegarder.
      enum: [REPUBLISHED, REPUBLICATION_TO_CHECK, DELETION_TO_CHECK, WAITING, TO_REPUBLISH, SOLD, GONE, TO_DELETE,
        VERIFICATION_FAILED, TO_VALIDATE, TO_BACK_UP]
    RunStatus:
      type: string
      description: >
        Aucune série depuis le démarrage, relance en cours, attente d'une date, pause, série terminée, série arrêtée.
      enum: [IDLE, RUNNING, WAITING, PAUSED, FINISHED, STOPPED]
    RunStopReason:
      type: string
      description: >
        Session Vinted non connectée, navigateur indisponible, Vinted inaccessible (réseau ou blocage anti-robot),
        page de Vinted illisible, échec inattendu (voir les logs), arrêt demandé par le membre.
      enum: [SESSION_DISCONNECTED, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, VINTED_PAGE_UNREADABLE, RUN_FAILED,
        STOPPED_BY_MEMBER]
    AutomaticRunOverview:
      type: object
      required: [status, workers, relaunchCount, skippedListingIds, pauseRequested, stopRequested]
      properties:
        status:
          $ref: '#/components/schemas/RunStatus'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: Fin de la série, terminée ou arrêtée.
        waitingUntil:
          type: string
          format: date-time
          description: >
            Date jusqu'à laquelle la série attend, la plus proche de ses workers ; présente pour WAITING.
        workers:
          type: array
          description: >
            Workers de la série (US-46) : un seul ALL_ACTIONS en mode séquentiel ; REPUBLICATION, DELETION et
            VERIFICATION, dans cet ordre, en mode workers. Vide quand aucune série n'a tourné depuis le démarrage.
          items:
            $ref: '#/components/schemas/RunWorker'
        relaunchCount:
          type: integer
          format: int32
          minimum: 0
          description: Relances faites par la série (dry-runs compris).
        skippedListingIds:
          type: array
          description: Annonces écartées de la série, dans l'ordre ; le membre tranche sur leur fiche.
          items:
            type: integer
            format: int64
        stopReason:
          $ref: '#/components/schemas/RunStopReason'
        pauseRequested:
          type: boolean
          description: Pause demandée, effective quand plus aucun worker ne relance.
        stopRequested:
          type: boolean
          description: Arrêt demandé, effectif quand chaque worker a fini sa relance en cours.
      example:
        status: RUNNING
        startedAt: '2026-11-17T10:00:00Z'
        workers:
          - kind: REPUBLICATION
            state: WORKING
            listingId: 10208799832
            action: REPUBLICATION
            relaunchCount: 2
          - kind: DELETION
            state: WAITING
            waitingUntil: '2026-11-17T10:05:00Z'
            waitingReason: CADENCE
            relaunchCount: 1
          - kind: VERIFICATION
            state: IDLE
            relaunchCount: 0
        relaunchCount: 3
        skippedListingIds: []
        pauseRequested: false
        stopRequested: false
    RunWorkerKind:
      type: string
      description: >
        Étapes que prend le worker : toutes (mode séquentiel), republication (à republier, en attente), suppression
        (suppression à vérifier, prête à supprimer), vérification (republication à vérifier, puis suppression à
        vérifier).
      enum: [ALL_ACTIONS, REPUBLICATION, DELETION, VERIFICATION]
    RunWorkerState:
      type: string
      description: En relance, en attente d'une date, sans rien à faire, hors série (en pause ou série finie).
      enum: [WORKING, WAITING, IDLE, STOPPED]
    RunWaitingReason:
      type: string
      description: Cadence du type d'écriture, délai de republication, navigateur occupé.
      enum: [CADENCE, REPUBLICATION_DELAY, BROWSER_BUSY]
    RunWorker:
      type: object
      required: [kind, state, relaunchCount]
      properties:
        kind:
          $ref: '#/components/schemas/RunWorkerKind'
        state:
          $ref: '#/components/schemas/RunWorkerState'
        listingId:
          type: integer
          format: int64
          description: Annonce en cours de relance ; présente pour WORKING.
        action:
          $ref: '#/components/schemas/RelaunchAction'
        waitingUntil:
          type: string
          format: date-time
          description: Fin de l'attente ; présente pour WAITING.
        waitingReason:
          $ref: '#/components/schemas/RunWaitingReason'
        relaunchCount:
          type: integer
          format: int32
          minimum: 0
          description: Relances faites par ce worker.
    RelaunchRequest:
      type: object
      required: [stage]
      properties:
        stage:
          $ref: '#/components/schemas/ListingStage'
      example:
        stage: TO_DELETE
    RelaunchAction:
      type: string
      description: >
        Action lancée : suppression, revérification de la suppression, republication, vérification de la
        republication.
      enum: [DELETION, DELETION_RECHECK, REPUBLICATION, REPUBLICATION_VERIFICATION]
    RelaunchReport:
      type: object
      required: [action, dryRun, listing]
      properties:
        action:
          $ref: '#/components/schemas/RelaunchAction'
        dryRun:
          type: boolean
          description: Vrai si l'action s'est arrêtée en dry-run, sans rien modifier sur Vinted ni rien garder.
        listing:
          $ref: '#/components/schemas/Listing'
    DataArchiveRefusal:
      type: object
      description: Raison pour laquelle l'archive n'a pas été envoyée.
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/DataArchiveRefusalReason'
    DataArchiveRefusalReason:
      type: string
      description: Action navigateur en cours, ou archive impossible à construire.
      enum: [BROWSER_BUSY, ARCHIVE_FAILED]
    RelaunchRefusal:
      type: object
      description: Raison pour laquelle la relance n'a pas abouti.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [STAGE_CHANGED, NOT_RELAUNCHABLE, CADENCE_LIMIT_REACHED, BROWSER_BUSY, ACTION_REFUSED,
                 BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, SESSION_DISCONNECTED, VINTED_PAGE_UNREADABLE,
                 RELAUNCH_FAILED]
        stage:
          $ref: '#/components/schemas/ListingStage'
        allowedAt:
          type: string
          format: date-time
          description: >
            Date à partir de laquelle la relance redevient possible : fin de la limite de cadence
            (CADENCE_LIMIT_REACHED), ou date de republication d'une annonce en attente (NOT_RELAUNCHABLE).
      example:
        reason: STAGE_CHANGED
        stage: DELETION_TO_CHECK
    ListingStatistics:
      type: object
      description: >-
        Relevé des vues et favoris de l'annonce, lus sur sa carte du dressing pendant un scan ou un rafraîchissement ; absent si
        l'annonce n'a jamais été relevée (session non connectée, par exemple).
      required: [viewCount, favouriteCount, readAt]
      properties:
        viewCount:
          type: integer
          format: int32
          minimum: 0
        favouriteCount:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de favoris (les « likes » de Vinted).
        readAt:
          type: string
          format: date-time
          description: Fin du relevé du dressing qui a lu ces nombres.
      example:
        viewCount: 12
        favouriteCount: 3
        readAt: '2026-11-11T10:05:00Z'
    Price:
      type: object
      description: Prix affiché sur Vinted, hors frais.
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    ScanProblem:
      type: string
      description: Raison pour laquelle le dernier scan n'a pas abouti.
      enum: [BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, WARDROBE_UNREADABLE, SCAN_FAILED]
    StatisticsRefreshProblem:
      type: string
      description: >
        Raison pour laquelle le dernier rafraîchissement des vues et favoris n'a pas abouti : navigateur indisponible,
        Vinted inaccessible, dressing illisible (incomplet), aucune carte ne montre ses nombres, échec imprévu.
      enum: [BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, WARDROBE_UNREADABLE, NO_STATISTICS_SHOWN, REFRESH_FAILED]
    BackupProblem:
      type: string
      description: >
        Raison pour laquelle la dernière sauvegarde n'a pas abouti : navigateur indisponible, Vinted inaccessible,
        session non connectée, annonce illisible, échec de la sauvegarde.
      enum: [BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, SESSION_DISCONNECTED, LISTING_UNREADABLE, BACKUP_FAILED]
    SessionOverview:
      type: object
      description: Aperçu de session ; un champ absent signifie « aucun ».
      properties:
        status:
          $ref: '#/components/schemas/SessionStatus'
        currentAction:
          $ref: '#/components/schemas/BrowserAction'
        problem:
          $ref: '#/components/schemas/SessionProblem'
    SessionStatus:
      type: string
      description: État de session ; absent tant qu'aucune vérification n'a eu lieu (« non vérifié »).
      enum: [CONNECTED, DISCONNECTED]
    BrowserAction:
      type: string
      description: Action navigateur en cours.
      enum: [CHECKING, LOGGING_IN, SCANNING, BACKING_UP, VERIFYING_BACKUPS, DELETING, REPUBLISHING,
        REFRESHING_STATISTICS, ARCHIVING]
    SessionProblem:
      type: string
      description: Raison pour laquelle la dernière action navigateur n'a pas abouti.
      enum: [MANUAL_LOGIN_NOT_COMPLETED, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE]
    ListingBackupView:
      type: object
      description: Ce que le membre voit de la sauvegarde d'une annonce avant de la valider.
      required: [vintedId, savedAt, verification, content, photos, deletionDryRun, republicationDryRun]
      properties:
        vintedId:
          type: integer
          format: int64
        deletionDryRun:
          type: boolean
          description: Vrai tant que le dry-run est actif (aucune suppression réelle) ; se règle par DELETION_DRY_RUN.
        dryRunPassed:
          type: boolean
          description: Présent et vrai seulement dans la réponse d'un dry-run réussi ; rien n'a été supprimé.
        deletion:
          $ref: '#/components/schemas/ListingDeletion'
        republicationDryRun:
          type: boolean
          description: >
            Vrai tant que le dry-run de la republication est actif (aucune republication réelle) ; se règle par
            REPUBLICATION_DRY_RUN.
        republicationDryRunPassed:
          type: boolean
          description: >
            Présent et vrai seulement dans la réponse d'un dry-run de republication réussi : tout a pu être rempli,
            rien n'a été publié.
        republication:
          $ref: '#/components/schemas/ListingRepublication'
        republicationComparison:
          type: array
          description: >
            Présente seulement dans la réponse d'une vérification qui a comparé la nouvelle annonce à la sauvegarde :
            les champs qui diffèrent ; vide si la nouvelle annonce est identique à la sauvegarde.
          items:
            $ref: '#/components/schemas/ListingFieldDifference'
        newListingSearch:
          type: string
          enum: [NOT_FOUND, SEVERAL]
          description: >
            Présent seulement dans la réponse d'une vérification d'annonce à relier (US-48) restée sans résultat :
            aucune (NOT_FOUND) ou plusieurs (SEVERAL) annonces au titre et au prix de la sauvegarde parmi celles
            affichées à l'ouverture du dressing ; rien n'est enregistré, le membre colle le lien de la nouvelle annonce.
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde ; à renvoyer pour la valider.
        validatedAt:
          type: string
          format: date-time
          description: Date de validation de cette version de la sauvegarde ; absente si elle n'est pas validée.
        verification:
          $ref: '#/components/schemas/BackupVerification'
        content:
          $ref: '#/components/schemas/ListingBackupContent'
        photos:
          type: array
          description: Photos gardées, dans l'ordre de l'annonce (la première est la couverture).
          items:
            $ref: '#/components/schemas/KeptPhoto'
      example:
        vintedId: 10208778166
        savedAt: '2026-11-10T10:00:00Z'
        verification:
          passed: true
          failures: []
        content:
          title: Pull rayé
          description: Porté deux fois
          price: {amount: 12.50, currency: EUR}
          category: Pulls
          brand: Kiabi
          condition: Très bon état
          size: M
          colors: Blanc
          packageSize: Petit
        photos:
          - rank: 0
            url: /api/listings/10208778166/backup/photos/0
    BackupVerification:
      type: object
      description: Vérification de la sauvegarde, refaite à chaque demande ; réussie si aucun échec.
      required: [passed, failures]
      properties:
        passed:
          type: boolean
        failures:
          type: array
          items:
            $ref: '#/components/schemas/VerificationFailure'
    VerificationFailure:
      type: object
      description: >
        Raison pour laquelle la sauvegarde ne permet pas de republier l'annonce : aucune photo, photo manquante,
        photo modifiée, annonce absente du dressing (ou de Vinted, pour une vérification sur Vinted), titre ou prix
        différent du dernier scan, champ du formulaire relu sur Vinted différent de la sauvegarde (US-40).
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/VerificationFailureKind'
        rank:
          type: integer
          format: int32
          minimum: 0
          description: Rang de la photo, pour PHOTO_MISSING et PHOTO_ALTERED.
        savedTitle:
          type: string
          description: Titre sauvegardé, pour TITLE_CHANGED.
        scannedTitle:
          type: string
          description: Titre lu au dernier scan, pour TITLE_CHANGED.
        savedPrice:
          $ref: '#/components/schemas/Price'
        scannedPrice:
          $ref: '#/components/schemas/Price'
        difference:
          $ref: '#/components/schemas/ListingFieldDifference'
    VerificationFailureKind:
      type: string
      enum: [NO_PHOTO, PHOTO_MISSING, PHOTO_ALTERED, LISTING_ABSENT, TITLE_CHANGED, PRICE_CHANGED, FIELD_CHANGED]
    VerificationResult:
      type: object
      description: >
        Dernier résultat de la vérification sur Vinted de la sauvegarde actuelle (US-40) ; absent sans vérification
        de cette version. Réussi si aucun échec.
      required: [verifiedAt, passed, failures]
      properties:
        verifiedAt:
          type: string
          format: date-time
        passed:
          type: boolean
        failures:
          type: array
          items:
            $ref: '#/components/schemas/VerificationFailure'
      example:
        verifiedAt: '2026-11-18T10:00:00Z'
        passed: false
        failures:
          - kind: FIELD_CHANGED
            difference:
              field: SIZE
              saved: M (207)
              read: L (208)
    BackupVerificationStatus:
      type: string
      description: Aucune vérification depuis le démarrage, en cours, terminée, arrêtée.
      enum: [IDLE, RUNNING, FINISHED, STOPPED]
    BackupVerificationStopReason:
      type: string
      description: >
        Session Vinted expirée ou non connectée, navigateur indisponible, Vinted inaccessible (réponse HTTP ≥ 400
        autre que 404, réseau), formulaire illisible, échec inattendu (voir les logs).
      enum: [SESSION_DISCONNECTED, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, LISTING_UNREADABLE, VERIFICATION_ERROR]
    BackupVerificationProgress:
      type: object
      description: Avancement de la vérification en lot.
      required: [status, verifiedCount, totalCount, validatedCount, failedCount]
      properties:
        status:
          $ref: '#/components/schemas/BackupVerificationStatus'
        verifiedCount:
          type: integer
          format: int32
          minimum: 0
          description: Annonces déjà vérifiées (n de « n / N »).
        totalCount:
          type: integer
          format: int32
          minimum: 0
          description: Annonces concernées, fixées au lancement (N).
        validatedCount:
          type: integer
          format: int32
          minimum: 0
          description: Vérifications réussies, donc sauvegardes validées.
        failedCount:
          type: integer
          format: int32
          minimum: 0
          description: Vérifications échouées, annonces passées à VERIFICATION_FAILED.
        stopReason:
          $ref: '#/components/schemas/BackupVerificationStopReason'
      example:
        status: RUNNING
        verifiedCount: 3
        totalCount: 12
        validatedCount: 2
        failedCount: 1
    BackupVerificationRefusal:
      type: object
      description: Raison pour laquelle la vérification n'est pas lancée.
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/BackupVerificationRefusalReason'
    BackupVerificationRefusalReason:
      type: string
      description: Une autre action navigateur ou une série « Tout lancer » est en cours.
      enum: [BROWSER_BUSY]
    ListingBackupContent:
      type: object
      description: Contenu sauvegardé de l'annonce, par ses libellés ; un champ absent n'est pas renseigné.
      required: [title, description, price, category, condition, packageSize]
      properties:
        title:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        category:
          type: string
        brand:
          type: string
        condition:
          type: string
        size:
          type: string
        colors:
          type: string
        materials:
          type: string
        packageSize:
          type: string
        isbn:
          type: string
        bookTitle:
          type: string
        author:
          type: string
        manufacturer:
          type: string
        manufacturerLabel:
          type: string
        model:
          type: string
        measurementWidth:
          type: number
        measurementLength:
          type: number
        measurementUnit:
          type: string
    KeptPhoto:
      type: object
      required: [rank, url]
      properties:
        rank:
          type: integer
          format: int32
          minimum: 0
        url:
          type: string
          description: Adresse du fichier gardé dans l'API.
    BackupValidationRequest:
      type: object
      required: [savedAt]
      properties:
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde que le membre a vue.
    ValidationRefusal:
      type: object
      description: Raison pour laquelle la validation est refusée ; rien n'est validé.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [BACKUP_REPLACED, VERIFICATION_FAILED]
        verification:
          $ref: '#/components/schemas/BackupVerification'
    DeletionRequest:
      type: object
      required: [savedAt]
      properties:
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde que le membre a vue.
    ListingDeletion:
      type: object
      description: Dernière tentative de suppression de l'annonce, arrivée au clic de confirmation dans Vinted.
      required: [outcome, attemptedAt, backupSavedAt]
      properties:
        outcome:
          $ref: '#/components/schemas/DeletionOutcome'
        attemptedAt:
          type: string
          format: date-time
          description: Date du clic de confirmation dans Vinted.
        settledAt:
          type: string
          format: date-time
          description: Date de la preuve ou de la levée du doute ; absente tant que la suppression est non confirmée.
        backupSavedAt:
          type: string
          format: date-time
          description: Version de la sauvegarde sur laquelle s'appuie la suppression.
        republishableAt:
          type: string
          format: date-time
          description: >
            Date à partir de laquelle l'annonce peut être republiée : date de la preuve plus le délai minimal
            (republication.minimum-delay, 5 minutes). Présente seulement si la suppression est confirmée.
      example:
        outcome: CONFIRMED
        attemptedAt: '2026-11-11T10:00:00Z'
        settledAt: '2026-11-11T10:00:05Z'
        backupSavedAt: '2026-11-10T10:00:00Z'
        republishableAt: '2026-11-11T10:05:05Z'
    DeletionOutcome:
      type: string
      description: >
        CONFIRMED : Vinted ne montre plus l'annonce. UNCONFIRMED : suppression non confirmée, à revérifier sur Vinted.
        NOT_DONE : l'annonce était toujours là.
      enum: [CONFIRMED, UNCONFIRMED, NOT_DONE]
    DeletionRefusal:
      type: object
      description: Raison pour laquelle la suppression ou la revérification n'a pas eu lieu.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [BACKUP_REPLACED, NOT_VALIDATED, ALREADY_DELETED, DELETION_UNCONFIRMED, NO_UNCONFIRMED_DELETION,
                 BROWSER_BUSY, VERIFICATION_FAILED, LISTING_CHANGED, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE,
                 SESSION_DISCONNECTED, LISTING_PAGE_UNREADABLE, DELETION_FAILED, CADENCE_LIMIT_REACHED]
        verification:
          $ref: '#/components/schemas/BackupVerification'
        allowedAt:
          type: string
          format: date-time
          description: Date à partir de laquelle une écriture sur Vinted redevient permise ; présente pour CADENCE_LIMIT_REACHED.
        differences:
          type: array
          nullable: true
          description: Écarts entre l'annonce montrée par Vinted et sa sauvegarde ; présent pour LISTING_CHANGED seulement.
          items:
            $ref: '#/components/schemas/ListingDifference'
      example:
        reason: LISTING_CHANGED
        differences:
          - kind: PRICE_CHANGED
            savedPrice: {amount: 12.50, currency: EUR}
            readPrice: {amount: 10.00, currency: EUR}
    DuplicateGroups:
      type: object
      description: Les groupes de doublons et le mode des suppressions.
      required: [groups, deletionDryRun]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateGroup'
        deletionDryRun:
          type: boolean
          description: Le dry-run des suppressions est actif ; une suppression de doublon ne clique ni n'efface rien.
      example:
        deletionDryRun: false
        groups:
          - title: Robe bleue
            price: {amount: 12.00, currency: EUR}
            listings:
              - listingId: 90000000001
                url: https://www.vinted.fr/items/90000000001-robe-bleue
                firstSeenAt: '2026-11-18T10:05:00Z'
                backedUp: false
                deletable: false
              - listingId: 90000000002
                url: https://www.vinted.fr/items/90000000002-robe-bleue
                firstSeenAt: '2026-11-18T10:06:00Z'
                backedUp: false
                deletable: true
    DuplicateGroup:
      type: object
      description: Annonces présentes au dernier scan avec exactement le même titre et le même prix, au moins deux.
      required: [title, price, listings]
      properties:
        title:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        listings:
          type: array
          description: Par identifiant croissant.
          items:
            $ref: '#/components/schemas/DuplicateListing'
    DuplicateListing:
      type: object
      required: [listingId, url, firstSeenAt, backedUp, deletable]
      properties:
        listingId:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        firstSeenAt:
          type: string
          format: date-time
        backedUp:
          type: boolean
          description: L'annonce a une sauvegarde, qui serait effacée avec elle.
        deletable:
          type: boolean
          description: >
            Supprimable comme doublon : sans republication (ancienne ou nouvelle annonce), suppression ni vente.
    DuplicateDeletionReport:
      type: object
      description: Issue d'une suppression de doublon.
      required: [outcome, twinListingId]
      properties:
        outcome:
          $ref: '#/components/schemas/DuplicateDeletionOutcome'
        twinListingId:
          type: integer
          format: int64
          description: La jumelle relue active sur Vinted, qui reste en vente.
      example:
        outcome: DELETED
        twinListingId: 90000000001
    DuplicateDeletionOutcome:
      type: string
      description: >
        Supprimé de Vinted et effacé ; déjà absent de Vinted et effacé sans clic ; dry-run réussi, rien cliqué ni
        effacé ; suppression non confirmée après le clic, rien effacé (vérifier sur Vinted, puis redemander).
      enum: [DELETED, ALREADY_GONE, DRY_RUN_PASSED, UNCONFIRMED]
    DuplicateDeletionRefusal:
      type: object
      description: Raison pour laquelle la suppression du doublon n'a pas eu lieu.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [NOT_A_DUPLICATE, HAS_HISTORY, BROWSER_BUSY, CADENCE_LIMIT_REACHED, TWIN_NOT_CONFIRMED, LISTING_CHANGED,
                 BROWSER_UNAVAILABLE, VINTED_UNREACHABLE, SESSION_DISCONNECTED, LISTING_PAGE_UNREADABLE,
                 DELETION_FAILED]
        allowedAt:
          type: string
          format: date-time
          description: Date à partir de laquelle une écriture sur Vinted redevient permise ; présente pour CADENCE_LIMIT_REACHED.
        differences:
          type: array
          nullable: true
          description: >
            Écarts entre le doublon montré par Vinted et son titre et son prix enregistrés au dernier scan (champs
            saved*) ; présent pour LISTING_CHANGED seulement.
          items:
            $ref: '#/components/schemas/ListingDifference'
      example:
        reason: TWIN_NOT_CONFIRMED
    ListingDifference:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [NOT_ACTIVE, TITLE_CHANGED, PRICE_CHANGED]
        savedTitle:
          type: string
          description: Titre sauvegardé, pour TITLE_CHANGED.
        readTitle:
          type: string
          description: Titre lu sur Vinted, pour TITLE_CHANGED.
        savedPrice:
          $ref: '#/components/schemas/Price'
        readPrice:
          $ref: '#/components/schemas/Price'
    RepublicationRequest:
      type: object
      required: [savedAt]
      properties:
        savedAt:
          type: string
          format: date-time
          description: Date de la sauvegarde que le membre a vue.
    ListingRepublication:
      type: object
      description: >
        Republication de l'annonce, arrivée au clic sur « Publier » ; absente si aucune tentative n'y est arrivée.
      required: [outcome, attemptedAt, backupSavedAt]
      properties:
        outcome:
          $ref: '#/components/schemas/RepublicationOutcome'
        attemptedAt:
          type: string
          format: date-time
          description: Date du clic sur « Publier ».
        publishedAt:
          type: string
          format: date-time
          description: Date à laquelle la nouvelle annonce a été retrouvée dans le dressing ; présente si PUBLISHED.
        newListingId:
          type: integer
          format: int64
          description: Identifiant Vinted de la nouvelle annonce ; présent si PUBLISHED.
        newListingUrl:
          type: string
          format: uri
          description: Adresse de la nouvelle annonce sur Vinted ; présente si PUBLISHED.
        backupSavedAt:
          type: string
          format: date-time
          description: Version de la sauvegarde republiée.
        checkedAt:
          type: string
          format: date-time
          description: Date à laquelle le membre l'a validée non publiée ; présente si NOT_PUBLISHED.
      example:
        outcome: PUBLISHED
        attemptedAt: '2026-11-11T10:06:00Z'
        publishedAt: '2026-11-11T10:06:20Z'
        newListingId: 10300000001
        newListingUrl: https://www.vinted.fr/items/10300000001-robe-bleue
        backupSavedAt: '2026-11-10T10:00:00Z'
    RepublicationOutcome:
      type: string
      description: >
        PUBLISHED : la nouvelle annonce a été retrouvée, seule, parmi les annonces récentes du dressing, ou validée par
        le membre avec son lien. FAILED : erreur de republication, à vérifier sur Vinted ; bloque toute nouvelle
        republication de l'annonce. NOT_PUBLISHED : le membre a constaté sur Vinted qu'elle n'est pas publiée ; une
        nouvelle republication est possible.
      enum: [PUBLISHED, FAILED, NOT_PUBLISHED]
    RepublicationValidation:
      type: object
      description: Ce que le membre a constaté lui-même sur Vinted pour une republication en erreur.
      required: [published]
      properties:
        published:
          type: boolean
          description: Vrai si la nouvelle annonce est en ligne sur Vinted.
        newListingUrl:
          type: string
          maxLength: 2048
          description: Lien de la nouvelle annonce, tel que copié depuis Vinted ; requis si published est vrai.
      example:
        published: true
        newListingUrl: https://www.vinted.fr/items/10302211455-bonnet-1-3-mois-du-pareil-au-meme
    RepublicationRefusal:
      type: object
      description: Raison pour laquelle la republication n'a pas eu lieu ; rien n'est publié ni enregistré.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [BACKUP_REPLACED, NOT_VALIDATED, NOT_DELETED, TOO_EARLY, ALREADY_REPUBLISHED, REPUBLICATION_IN_ERROR,
                 BROWSER_BUSY, PHOTOS_NOT_VERIFIED, FIELD_NOT_FILLABLE, BROWSER_UNAVAILABLE, VINTED_UNREACHABLE,
                 SESSION_DISCONNECTED, FORM_UNREADABLE, REPUBLICATION_FAILED, NO_REPUBLICATION_TO_VERIFY,
                 LISTING_UNREADABLE, CADENCE_LIMIT_REACHED, NEW_LISTING_LINK_INVALID, NEW_LISTING_MISMATCH,
                 MANUAL_REPUBLICATION_IN_DRY_RUN]
        republishableAt:
          type: string
          format: date-time
          description: Date de republication de l'annonce ; présente pour TOO_EARLY.
        allowedAt:
          type: string
          format: date-time
          description: Date à partir de laquelle une écriture sur Vinted redevient permise ; présente pour CADENCE_LIMIT_REACHED.
        verification:
          $ref: '#/components/schemas/BackupVerification'
        field:
          $ref: '#/components/schemas/ListingFormField'
        optionId:
          type: integer
          format: int64
          description: Identifiant Vinted de l'option introuvable, pour FIELD_NOT_FILLABLE quand il y en a une.
      example:
        reason: FIELD_NOT_FILLABLE
        field: SIZE
        optionId: 588
    ListingFieldDifference:
      type: object
      description: >
        Champ dont la valeur lue sur la nouvelle annonce (ou, pour FIELD_CHANGED, sur l'annonce relue) n'est pas
        celle sauvegardée. Les options sont comparées par
        leur identifiant Vinted et montrées « libellé (identifiant) » ; les photos par leur nombre.
      required: [field, saved, read]
      properties:
        field:
          $ref: '#/components/schemas/ListingFormField'
        saved:
          type: string
          description: Valeur sauvegardée ; vide si le champ n'était pas rempli.
        read:
          type: string
          description: Valeur lue sur la nouvelle annonce ; vide si le champ n'y est pas rempli.
      example:
        field: SIZE
        saved: 1-3 mois / 56 cm (613)
        read: 3-6 mois / 62 cm (614)
    ListingFormField:
      type: string
      description: Champ du formulaire de mise en vente impossible à remplir, ou qui diffère de la sauvegarde.
      enum: [PHOTOS, TITLE, DESCRIPTION, PRICE, CATEGORY, BRAND, CONDITION, SIZE, COLORS, MATERIALS, PACKAGE_SIZE,
             ISBN, BOOK_TITLE, AUTHOR, MANUFACTURER, MODEL, MEASUREMENTS]
